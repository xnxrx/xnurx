<!-- 24 - mode standalone/PWA   [address-bar spoofing | macOS: Dia/Arc/Chrome macOS (app-mode)]
     MEKANISME : di display-mode standalone bilah menyusut atau hilang; sisa permukaan yang menyebut origin jadi sangat sedikit.
     PREDIKAT  : di app-mode tidak ada permukaan yang menyebut origin.
     AMAN      : strip URL minimal tetap dipaksa tampil.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>24 mode standalone/PWA</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var m=matchMedia('(display-mode: standalone)').matches?'standalone':'browser';o.textContent='display-mode: '+m+' | REAL: '+location.origin;}
</script>
