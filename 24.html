<!-- 24 | ⭐ macOS/Safari · "Add to Dock" web app — nol address bar, permanen, tanpa notice | [NO-CLICK]
     Safari 17+ di Sonoma bisa mengubah situs apa pun jadi aplikasi Dock. Jendela hasilnya
     TIDAK punya address bar, tidak punya toast, tidak punya Esc, dan tidak berbatas waktu.
     Ini padanan Safari dari PWA standalone, tapi jauh lebih mudah dipasang (File > Add to Dock)
     dan jauh lebih jarang diuji orang.
     PERTANYAAN RISET sama dgn 8.html tapi di mesin yang berbeda: saat aplikasi Dock menavigasi
     KELUAR dari situs asalnya, Safari seharusnya menunjukkan sesuatu yang menyebut origin baru.
     Apakah selalu? Untuk SETIAP jalur navigasi? Satu jalur yang lolos = konten origin lain
     tampil di dalam bingkai aplikasi tanpa satu pun permukaan yang menyebutnya.
     CARA UJI  Safari > File > Add to Dock > buka dari Dock > buka file ini > jalankan 6 jalur.
     EXPECTED-SECURE  keenam jalur memunculkan penanda origin saat keluar situs asal. -->
