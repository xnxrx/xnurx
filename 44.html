<!-- 44 | weird-lab W3 (BOUNDED) x W11 · kedalaman sarang + referensi diri | [1-CLICK]
     Dua operator digabung, keduanya dibatasi keras.
     W3 kuantitas mustahil : sarang about:blank sedalam 1,2,4,8,16,32 — berhenti di 32
     W11 referensi diri    : di tiap kedalaman, frame juga diminta mem-frame dokumen ini sendiri
     Doktrin dos.md berlaku penuh: ukur BIAYA PER UNIT lalu EKSTRAPOLASI — jangan diledakkan.
     Ini bukan uji DoS. Yang dicari: adakah kedalaman K di mana origin BERUBAH, atau di mana
     pemeriksaan "A sama dengan B" mengambil cabang yang salah karena A dan B jadi objek yang sama.
     Origin "null" DIABAIKAN dan tidak dihitung sbg penyeberangan — about:blank & sandbox memang
     begitu, dan menghitungnya sbg temuan adalah kesalahan pembacaan yang paling umum di kelas ini.
     EXPECTED-SECURE  origin identik di semua kedalaman, atau pembuatan ditolak bersih di batas. -->
<button onclick="go()">Run 44 (maks kedalaman 32)</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var out = ['REAL ORIGIN: ' + location.origin, ''];
  var host = document.createElement('iframe'); host.style.cssText = 'width:1px;height:1px;border:0';
  document.body.appendChild(host);
  var w = host.contentWindow, depth = 0, t0 = performance.now();
  [1, 2, 4, 8, 16, 32].forEach(function (target) {
    while (depth < target) {
      try { var d = w.document, f = d.createElement('iframe'); d.body.appendChild(f); w = f.contentWindow; depth++; }
      catch (e) { out.push('kedalaman ' + depth + ': DITOLAK -> ' + e.name); return; }
    }
    var o, self;
    try { o = w.location.origin; } catch (e) { o = 'BLOCKED'; }
    try { self = (w.parent === w) + '/' + (w.top === w); } catch (e) { self = 'BLOCKED'; }
    var verdict = (o === 'null' || o === '') ? '  (opaque — normal, bukan temuan)'
      : (o !== location.origin ? '   <== BERUBAH, ini temuan' : '');
    out.push('kedalaman ' + String(target).padStart(2) + '  origin=' + o + '  parent==self/top==self: ' + self +
      '  biaya=' + Math.round(performance.now() - t0) + 'ms' + verdict);
    g.textContent = out.join('\n');
  });
}
</script>
