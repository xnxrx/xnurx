<!-- 44 | W11 x W3  REFERENSI DIRI x KUANTITAS (BOUNDED) - blob yang melahirkan blob | [1-CLICK]
     ASUMSI YANG DILANGGAR  "rantai asal-usul dokumen itu pendek dan bisa ditelusuri"
     IDE GILA  blob: adalah dokumen tanpa origin jaringan - ia MEWARISI. Sekarang buat blob
     yang isinya membuat blob berikutnya, tiga tingkat (bounded, berhenti sendiri).
     Pertanyaannya: pada tingkat ketiga, dari mana persisnya origin diwarisi - dari pembuat
     langsungnya, atau dari akar rantai? Kalau kedua jawaban itu bisa berbeda,
     berarti ada tingkat di mana pewarisan "kehilangan jejak" - dan dokumen yang kehilangan
     jejak asalnya adalah dokumen yang tidak bisa diatribusikan oleh permukaan mana pun.
     Setiap tingkat mencetak origin-nya sendiri, jadi rantai lengkapnya terlihat di satu layar.
     EXPECTED-SECURE  ketiga tingkat mencetak origin yang identik dengan halaman ini.
     BOUNDED KERAS: 3 tingkat, URL dicabut sesudah dipakai. -->
<button onclick="go()">Run 44</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var body = function (n) {
    return '<pre style="font:12px monospace">tingkat ' + n + ' origin = ' + '\'+location.origin+\'' + '</pre>' +
      (n < 3 ? '<script>var b=URL.createObjectURL(new Blob(["<pre>tingkat ' + (n + 1) +
        ' origin = "+location.origin+"<\\/pre>"],{type:"text/html"}));' +
        'var f=document.createElement("iframe");f.src=b;f.style.cssText="width:99%;height:60px";document.body.appendChild(f);<\/script>' : '');
  };
  var u = URL.createObjectURL(new Blob(['<script>document.write(\'' + body(1) + '\')<\/script>'], { type: 'text/html' }));
  var f = document.createElement('iframe'); f.src = u; f.style.cssText = 'width:99%;height:220px'; document.body.appendChild(f);
  setTimeout(function () { URL.revokeObjectURL(u); }, 3000);
  g.textContent = 'REAL ORIGIN: ' + location.origin + '\n\nBandingkan origin tingkat 1/2/3 di bawah.\nAda satu yang beda = jejak pewarisan putus di situ.';
}
</script>
