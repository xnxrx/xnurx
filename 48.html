<!-- 48 | JURNAL — tanpa ini, hasil abu-abu hilang tiap sesi | [NO-CLICK]
     Aturan yang paling sering dilanggar orang, dan yang paling mahal:
     hasil "kadang jalan" BUKAN kegagalan — itu bug yang jendelanya belum diukur.
     Skrip yang jalan 1 dari 20 kali hampir selalu berarti ada VARIABEL TERSEMBUNYI.
     Mayoritas orang membuangnya; karena itulah ia masih tersisa untukmu.
     Baris dengan p>0 TIDAK PERNAH DIHAPUS — ia dibangkitkan lagi saat versi engine berubah. -->
<pre id=g style="font:12px/1.7 monospace"></pre>
<textarea id=t rows=10 style="width:100%;font:12px monospace" placeholder="tempel barismu di sini, lalu Salin"></textarea>
<button onclick="navigator.clipboard&&navigator.clipboard.writeText(t.value)">Salin jurnal</button>
<script>
g.textContent =
  'FORMAT SATU BARIS PER PERCOBAAN:\n' +
  '  tanggal | file | operator | ide 1-kalimat | p (x/20) | engine+versi+OS | variabel dicurigai | status\n' +
  '\nstatus: dropped · widening (sedang dilebarkan) · deterministic (naik ke gerbang normal) · parked\n' +
  '\nCARA MEMBACA p:\n' +
  '  p = 1.0        deterministik   -> gerbang normal, lapor\n' +
  '  0 < p < 1      FLAKY           -> PALING BERHARGA, lanjut ke langkah berikut\n' +
  '  p = 1/20 sekali  ONCE          -> catat kondisinya selengkap mungkin\n' +
  '  p = 0          belum tersentuh -> GANTI OPERATOR, jangan menaikkan "kekuatan"\n' +
  '\nKALAU FLAKY, CARI VARIABEL TERSEMBUNYI — uji SATU PER SATU, jangan sekaligus:\n' +
  '  beban CPU/GC · jumlah frame hidup · status FOKUS jendela · tab latar vs depan\n' +
  '  urutan microtask vs task · cache dingin/panas · ukuran layar/DPI · profil bersih\n' +
  '\nLALU LEBARKAN JENDELANYA sampai p mendekati 1.0:\n' +
  '  tambah beban render · tambah frame · CPU throttle di DevTools · jalankan di tab latar\n' +
  '  PoC flaky tidak bisa dilaporkan; PoC deterministik dari ide yang SAMA adalah bug.\n' +
  '\nVONIS JUJUR: kalau p tetap rendah tapi reprodusibel, laporkan DENGAN ANGKANYA\n' +
  '  "berhasil 3 dari 20 pada Safari X / macOS Y; dgn tab di latar naik jadi 9 dari 20"\n' +
  '  Kejujuran itu yang membedakan laporan yang ditriase serius dari yang ditutup not-reproducible.';
t.value = new Date().toISOString().slice(0, 10) + ' | __.html | W_ | ' +
  ' | __/20 | ' + navigator.userAgent.slice(0, 40) + ' | ? | widening';
</script>
