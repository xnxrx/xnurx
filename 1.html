<!-- 02 - FULLSCREEN MEMBUAT TES CONTAINMENT KURSOR JADI VAKUM
     MEKANISME: pagar kursor-kustom bersifat GEOMETRIS ("apakah raster beririsan dengan chrome browser?").
       Fullscreen MENGHAPUS chrome -> pagar menjawab "tidak" -> raster milik HALAMAN boleh mendarat di atas
       notice keluar-fullscreen, satu-satunya permukaan yang masih MENYEBUT origin (S20).
     PREDIKAT: pada frame T di mana lengan BASELINE menampilkan string origin di notice TERBACA,
       lengan TEST menampilkan region itu tertimpa raster halaman, sedangkan lengan CONTROL tetap terbaca.
     GARANSI YANG PECAH: notice fullscreen Gecko menjanjikan menyebut DOMAIN selama dwell-nya;
       piksel halaman tidak boleh menimpa permukaan yang browser gambar untuk menyebut origin.
     EXPECTED-SECURE: browser fallback ke panah sistem selama notice tampil, persis seperti di atas toolbar.
     CARA BACA (jangan pakai persentase dwell, jangan klaim persepsi user): unit bukti = "string origin di
       dalam notice tertutup pada frame yang di baseline terbaca".  Burst-screenshot 0/150/400/800/1500/2500ms.
     ARM: ?arm=baseline (tanpa kursor kustom) | ?arm=control (32px hotspot 0,0) | ?arm=test (120px hotspot 119,119) -->
<style>#b{position:fixed;left:50%;top:190px;transform:translateX(-50%)}</style>
<pre id=g style="font:12px/1.5 monospace"></pre><button id=b>Enter fullscreen</button>
<script>
var arm = (location.search.match(/arm=(\w+)/) || [, 'baseline'])[1], n = arm == 'test' ? 120 : 32, h = arm == 'test' ? 119 : 0,
    svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + n + '" height="' + n + '"><rect width="' + n + '" height="' + n + '" fill="%23ffffff"/></svg>';
if (arm != 'baseline') document.body.style.cursor = "url('data:image/svg+xml;utf8," + svg + "') " + h + ' ' + h + ', auto';
g.textContent = 'REAL: ' + location.href + '\nARM: ' + arm + '  (baseline | control | test)\nKlik tombol; auto-exit 6s; Esc kapan saja.';
b.onclick = function () { document.documentElement.requestFullscreen(); setTimeout(function () { document.exitFullscreen && document.exitFullscreen(); }, 6000); };
addEventListener('fullscreenchange', function () { g.textContent += '\nfullscreenchange @' + Math.round(performance.now()) + 'ms'; });
</script>
