<!-- 61 - peta properti apa yang benar-benar bocor   [UXSS popup | U1=popup U2=permukaan penegakan (instrumen) | T2 | macOS: Dia/Arc/Safari/Chrome]
     GERBANG YANG DISERANG : daftar putih properti WindowProxy lintas-origin (mencari anggota tambahan)
     DI MANA PALING MUNGKIN TEMBUS : fork yang tertinggal patch (Dia/Arc/Brave/Vivaldi/Opera/Samsung),
                 WebView & in-app browser, build lama, atau konteks ber-sandbox/ekstensi. Di Chrome/Safari
                 terbaru yang sehat, jawaban BLOCKED adalah jawaban yang BENAR - catat versinya, jangan dipaksa.
     MEKANISME : bukan mencoba satu trik, tapi MEMETAKAN: setelah popup memuat situs korban, tiap properti jendela disentuh satu per satu dan dicatat mana yang lolos. Daftar yang lolos seharusnya persis daftar putih spesifikasi - anggota tambahan apa pun adalah retakan.
     PREDIKAT  : ada properti DI LUAR daftar putih (closed/frames/length/opener/parent/top/window/self/location-write/focus/blur/close/postMessage) yang bisa dibaca.
     AMAN      : akses lintas-origin ditolak SecurityError; baris bukti berkata BLOCKED.
     ANTI-FP   : vonis HANYA dari pembacaan isi korban (judul/origin yang dilaporkan sendiri).
                 "berhasil menulis" ke dokumen kosong awal BUKAN bukti - itu memang dokumen kita.
                 Kontrol batch = 64.html; kalau 64 ikut CROSSED, semua hasil batch ini batal.
     ETIKA     : browser & mesin sendiri. Korban = example.com (IANA reserved). Nol form, nol kredensial,
                 nol fetch/beacon, nol resource luar. Berhenti di predikat -> screenshot -> lapor VRP. -->
<meta charset="utf-8"><title>61 peta properti apa yang benar-benar bocor</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var V='https://example.com/';var o;function say(s){o=o||document.getElementById('o');o.textContent=s;}
function rd(w){try{var t=w.document.title;return 'CROSSED -> baca judul lintas-origin: "'+t+'"';}catch(e){return 'BLOCKED (aman): '+e.name;}}
addEventListener('load',function(){say('REAL: '+location.origin+' | siap');});
var w;var P=['closed','frames','length','opener','parent','top','window','self','document','name','origin','localStorage','navigator','history','location'];
var WL={closed:1,frames:1,length:1,opener:1,parent:1,top:1,window:1,self:1,location:1};
function go(){w=window.open(V,'x','width=520,height=620');
setTimeout(function(){var ok=[],extra=[];for(var i=0;i<P.length;i++){try{var v=w[P[i]];void v;ok.push(P[i]);if(!WL[P[i]])extra.push(P[i]);}catch(e){}}
say('lolos: '+ok.join(',')+' || DI LUAR daftar putih: '+(extra.length?extra.join(',')+' <- periksa ini':'tidak ada (aman)'));},3500);}
</script>
