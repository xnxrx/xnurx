<!-- 36 | macOS/Safari · VIDEO Picture-in-Picture — jendela melayang tanpa origin | [1-CLICK]
     Safari tidak punya Document PiP (file 7 mati di sini), tapi punya VIDEO PiP: jendela
     melayang selalu-di-atas, di luar semua jendela browser, tanpa satu pun teks origin.
     Isinya memang terbatas pada video — jadi pertanyaannya bukan "bisa render UI apa saja"
     melainkan: seberapa jauh sebuah <video> bisa dijadikan permukaan penipuan?
     Video adalah kanvas: frame-nya bisa dihasilkan dari <canvas> lewat captureStream(),
     dan canvas bisa menggambar APA SAJA — termasuk tiruan panel sistem. Jadi jendela
     melayang tanpa atribusi itu bisa menampilkan gambar sewenang-wenang.
     YANG DICATAT  (a) apakah PiP menerima stream dari canvas? (b) adakah teks origin di
     jendela PiP? (c) apakah ia bertahan setelah tab asalnya ditutup?
     (c) yang paling penting: atribusi yang hidup lebih lama dari jendelanya.
     EXPECTED-SECURE  jendela PiP menyebut origin sumbernya, dan mati bersama tab asalnya. -->
<button onclick="go()">Run 36</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<canvas id=c width=480 height=270 style="border:1px solid #ccc;max-width:100%"></canvas>
<video id=v muted playsinline style="display:none"></video>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var x = c.getContext('2d'), t = 0;
  setInterval(function () {
    t++;
    x.fillStyle = '#f1f3f4'; x.fillRect(0, 0, 480, 270);
    x.fillStyle = '#202124'; x.font = '15px -apple-system,system-ui';
    x.fillText('digambar oleh canvas — bukan UI sistem', 16, 40);
    x.fillText('origin asli: ' + location.origin, 16, 70);
    x.fillText('frame ' + t, 16, 100);
  }, 200);
  try {
    v.srcObject = c.captureStream(5);
    v.play().then(function () { return v.requestPictureInPicture ? v.requestPictureInPicture() : Promise.reject('API tidak ada'); })
      .then(function (w) {
        g.textContent = 'REAL ORIGIN: ' + location.origin +
          '\nPiP aktif: ' + w.width + 'x' + w.height +
          '\n\nCATAT: (a) ada teks origin di jendela PiP? (b) tutup TAB ini — PiP bertahan?';
      }, function (e) { g.textContent = 'REAL ORIGIN: ' + location.origin + '\nPiP ditolak: ' + e; });
  } catch (e) { g.textContent = 'captureStream gagal: ' + e.name; }
}
</script>
