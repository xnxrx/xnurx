<!-- 31 | pasangan 30 — halaman B, sengaja dibuat sangat berbeda secara visual | [NO-CLICK]
     Halaman ini harus BEDA TOTAL dari 30.html supaya saat swipe ditahan kamu bisa memastikan
     dengan satu pandangan halaman mana yang sedang terlihat.
     Ia juga menambah satu sumbu: rantai history diperdalam, sehingga swipe-back bisa diulang
     beberapa kali berturut-turut. Kalau jendelanya ada, ia bisa dirantai — dan rantai
     memperpanjang total waktu "bar tidak cocok dengan layar".
     EXPECTED-SECURE  di setiap tingkat rantai, bar dan layar tetap sepakat. -->
<body style="background:#101;color:#0f0;font:15px system-ui;padding:20px">
<h2 style="color:#0f0">HALAMAN B — hitam, jelas berbeda dari A</h2>
<button onclick="deep()">perdalam history (untuk swipe berantai)</button>
<a href="30.html" style="color:#6cf;margin-left:10px">kembali ke A lewat tautan</a>
<pre id=g style="font:12px/1.7 monospace;color:#0f0"></pre>
<script>
var n = 0;
function draw() {
  g.textContent = 'REAL ORIGIN : ' + location.href +
    '\nentri history: ' + history.length + '  (kedalaman ditambah: ' + n + ')' +
    '\n\nSWIPE DUA JARI KE KANAN dan TAHAN. Layar akan menampilkan halaman putih (A).' +
    '\nSambil ditahan, baca address bar. Ia menulis A atau B?';
}
draw();
function deep() { for (var i = 0; i < 5; i++) { history.pushState({}, '', '#d' + (++n)); } draw(); }
</script>
