<!-- 46 | W12 x W4  HIDUP LAGI x KONTEKS MATI - pakai jendela SETELAH ditutup | [1-CLICK]
     ASUMSI YANG DILANGGAR  "yang sudah ditutup tidak bisa dipakai lagi"
     IDE GILA  close() menutup jendela, tapi VARIABEL JS yang memegangnya tetap ada. Objek itu
     jadi batu nisan: masih bisa disentuh, sudah tidak menunjuk apa pun.
     Kita tulis DOM ke batu nisan itu, lalu buka lagi jendela dengan NAMA YANG SAMA.
     Kalau browser memakai ulang slot bernama yang sudah mati, DOM yang kita tulis ke jendela
     mati bisa muncul di jendela yang baru - dokumen yang lahir sudah berisi tulisan dari
     dokumen yang sudah dikubur, tanpa navigasi apa pun yang bisa dicatat bar.
     YANG DIBACA  w.closed, apakah write ke jendela tertutup melempar, dan apakah jendela
     bernama-sama yang baru mewarisi apa pun.
     EXPECTED-SECURE  setiap operasi ke jendela tertutup adalah no-op bersih; slot nama tidak diwarisi. -->
<button onclick="go()">Run 46</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var out = ['REAL ORIGIN: ' + location.origin, ''];
  var w = window.open('', 'nisan', 'width=520,height=320');
  w.document.write('<h3 style="font:16px system-ui">hidup</h3>');
  w.close();
  out.push('setelah close(): w.closed = ' + w.closed);
  try { w.document.write('<h3>ditulis SETELAH ditutup</h3>'); out.push('write ke jendela mati : DITERIMA (tidak melempar)'); }
  catch (e) { out.push('write ke jendela mati : ditolak -> ' + e.name); }
  try { out.push('href jendela mati     : ' + w.location.href); } catch (e) { out.push('href jendela mati     : BLOCKED'); }
  setTimeout(function () {
    var n = window.open('', 'nisan', 'width=520,height=320,left=560');
    var txt; try { txt = n.document.body ? n.document.body.textContent.trim() : ''; } catch (e) { txt = 'BLOCKED'; }
    out.push('', 'jendela baru bernama sama, isi awal = ' + JSON.stringify(txt));
    out.push(txt ? '<== MEWARISI isi dari jendela yang sudah mati, ini temuan' : 'bersih (aman)');
    g.textContent = out.join('\n');
  }, 700);
  g.textContent = out.join('\n');
}
</script>
