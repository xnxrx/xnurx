<!-- 33 | label domain diisi karakter yang MERENDER KOSONG | [1-CLICK]
     Konsekuensi ketiga dari file 18. Kalau yang tampil cuma label domain, maka "bar kosong"
     tidak menuntut bug apa pun — cukup label yang secara visual tidak menampilkan apa-apa.
     Enam kelas karakter yang lebar-rendernya nol atau menyerupai spasi. Sebagian akan ditolak
     filter IDN dan jatuh ke punycode (itu perilaku yang BENAR); yang dicari adalah kelas yang LOLOS.
       U+3164 Hangul filler   · U+2800 Braille blank   · U+00A0 nbsp
       U+200B/200C/200D ZW    · U+FEFF BOM             · U+1160 Jungseong filler
     Diuji dua tempat: sebagai SUBDOMAIN (paling mungkin lolos) dan sebagai PATH
     (selalu lolos, tapi di Safari path tak terlihat — jadi ini sekaligus menguji klaim file 18).
     EXPECTED-SECURE  semua kelas ini jatuh ke punycode di label domain, dan terlihat di path. -->
<button onclick="sub()">uji di SUBDOMAIN</button>
<button onclick="path()">uji di PATH (pushState, nol request)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var C = [['Hangul filler U+3164', 'ㅤ'], ['Braille blank U+2800', '⠀'], ['nbsp U+00A0', ' '],
['zero-width U+200B', '​'], ['BOM U+FEFF', '﻿'], ['Jungseong U+1160', 'ᅠ']];
g.textContent = 'REAL ORIGIN: ' + location.href;
function sub() {
  C.forEach(function (c, i) {
    setTimeout(function () { window.open('https://' + c[1].repeat(12) + '.example.com/', '_blank'); }, i * 500);
  });
  g.textContent = 'REAL ORIGIN: ' + location.origin + '\n6 tab dibuka, tiap subdomain = 12x karakter kosong.' +
    '\n\nUntuk tiap tab: label domain terlihat KOSONG, atau jadi xn--?' +
    '\nKosong = kelas itu lolos filter IDN di mesin ini.';
}
function path() {
  var i = 0;
  var id = setInterval(function () {
    if (i >= C.length) { clearInterval(id); return; }
    var c = C[i++];
    history.pushState({}, '', '/' + c[1].repeat(40) + 'x');
    g.textContent = 'REAL ORIGIN: ' + location.origin + '\nsekarang: ' + c[0] +
      '\npanjang path: ' + location.pathname.length + ' karakter' +
      '\n\nBaca bar. Terlihat kosong? Atau path memang tidak ditampilkan sama sekali' +
      '\n(kalau begitu, klaim file 18 terkonfirmasi di mesin ini).';
  }, 2500);
}
</script>
