<!-- 38 - pelonggaran document.domain   [UXSS / SOP bypass | macOS: Dia/Arc/Chrome macOS]
     MEKANISME : mekanisme lama yang sudah dimatikan default; kalau fork masih menghidupkannya, batas origin bisa dilonggarkan sepihak.
     PREDIKAT  : document.domain masih bisa diubah dan melonggarkan batas.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>38 pelonggaran document.domain</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var b=document.domain;try{document.domain=b.split('.').slice(-2).join('.');}catch(e){o.textContent='DIBLOKIR (aman): '+e.name;return;}o.textContent=(document.domain!==b)?('BERUBAH '+b+' -> '+document.domain+' | BELUM temuan: masih harus dibuktikan baca lintas-subdomain'):'tidak berubah (aman)';}
</script>
