<!-- 38 | weird-lab W2 x W12 · membuka jendela DARI DALAM pagehide, lalu dibangkitkan bfcache | [1-CLICK]
     Dua operator aneh digabung — dan kombinasi dua operator jauh lebih subur dari satu.
     W2 saat-sekarat  : jendela dibuka pada milidetik ketika pembukanya sedang dibongkar
     W12 hidup lagi   : lalu pembukanya DIHIDUPKAN KEMBALI utuh oleh bfcache saat Back
     Yang diuji: setelah pembuka mati lalu hidup lagi, apakah handle ke jendela anak masih
     menunjuk objek yang sama? Kalau ya, ada dokumen yang openernya sempat tidak ada lalu
     kembali ada — keadaan yang tidak pernah terjadi di alur normal, dan karena itu jarang diuji.
     Safari relevan khusus di sini karena bfcache-nya jauh lebih agresif dari Chrome.
     PROSEDUR  klik Run -> halaman pergi -> tekan BACK -> baca laporan.
     EXPECTED-SECURE  handle mati bersih; tak ada dokumen yang openernya bangkit kembali. -->
<button onclick="go()">Run 38 (lalu tekan BACK)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var child = null;
function draw(x) { g.textContent = 'REAL ORIGIN: ' + location.href + '\n' + (x || ''); }
draw('klik Run, lalu tekan BACK saat halaman berpindah.');
addEventListener('pagehide', function () {
  try { child = window.open('', 'anak-sekarat', 'width=420,height=260'); if (child) child.document.write('<b style="font:14px system-ui">dibuka oleh dokumen yang sedang mati</b>'); } catch (e) { }
});
addEventListener('pageshow', function (e) {
  var s;
  try { s = child ? (child.closed ? 'TERTUTUP' : 'MASIH HIDUP — handle bertahan melewati kematian pembukanya') : 'null'; }
  catch (err) { s = 'BLOCKED (' + err.name + ')'; }
  draw('pageshow persisted(bfcache) = ' + e.persisted +
    '\nhandle anak = ' + s +
    '\n\n"MASIH HIDUP" + persisted=true berarti opener mati lalu bangkit,' +
    '\nsementara anaknya tak pernah tahu. Uji lalu: bisa ditulisi lagi? origin-nya apa?');
});
function go() { location.href = '31.html'; }
</script>
