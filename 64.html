<!-- 64 - KONTROL batch: popup polos   [UXSS popup | U1=popup U2=tanpa trik apa pun | KONTROL | macOS: Dia/Arc/Safari/Chrome]
     GERBANG YANG DISERANG : semua gerbang aktif - ini KONTROL, ia memang harus gagal
     DI MANA PALING MUNGKIN TEMBUS : fork yang tertinggal patch (Dia/Arc/Brave/Vivaldi/Opera/Samsung),
                 WebView & in-app browser, build lama, atau konteks ber-sandbox/ekstensi. Di Chrome/Safari
                 terbaru yang sehat, jawaban BLOCKED adalah jawaban yang BENAR - catat versinya, jangan dipaksa.
     MEKANISME : garis dasar untuk 51-63: buka situs korban di popup, jangan lakukan apa pun yang cerdik, lalu baca. Kalau arm ini melaporkan CROSSED, browser/profilmu sedang tidak menegakkan SOP (flag riset menyala, dua origin ternyata sama) dan SELURUH hasil 51-63 harus dibuang.
     PREDIKAT  : seharusnya SELALU BLOCKED.
     AMAN      : akses lintas-origin ditolak SecurityError; baris bukti berkata BLOCKED.
     ANTI-FP   : vonis HANYA dari pembacaan isi korban (judul/origin yang dilaporkan sendiri).
                 "berhasil menulis" ke dokumen kosong awal BUKAN bukti - itu memang dokumen kita.
                 Kontrol batch = 64.html; kalau 64 ikut CROSSED, semua hasil batch ini batal.
     ETIKA     : browser & mesin sendiri. Korban = example.com (IANA reserved). Nol form, nol kredensial,
                 nol fetch/beacon, nol resource luar. Berhenti di predikat -> screenshot -> lapor VRP. -->
<meta charset="utf-8"><title>64 KONTROL batch: popup polos</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var V='https://example.com/';var o;function say(s){o=o||document.getElementById('o');o.textContent=s;}
function rd(w){try{var t=w.document.title;return 'CROSSED -> baca judul lintas-origin: "'+t+'"';}catch(e){return 'BLOCKED (aman): '+e.name;}}
addEventListener('load',function(){say('REAL: '+location.origin+' | siap');});
var w;
function go(){w=window.open(V,'x','width=520,height=620');setTimeout(function(){say(rd(w));},3000);}
</script>
