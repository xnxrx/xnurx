
<!DOCTYPE html>
<html>
<body>
<script>
const w = open("https://www.threads.com", "MESSAGE_LAB");

if (w) {
  window.addEventListener("message", e => {
    console.log("Received:", e.data);
  });

  setTimeout(() => {
    if (!w.closed) {
      w.postMessage("LAB_STAGE_1", "*");
      w.document.body.innerHTML =
        "<h1>Message Experiment</h1>";
    }
  }, 1500);
}
</script>
</body>
</html>
