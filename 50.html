<!-- 50 - KONTROL: cookie lintas-origin   [UXSS / SOP bypass | macOS: semua macOS]
     MEKANISME : garis dasar kedua: mencoba membaca cookie origin korban lewat handle frame. Harus selalu ditolak.
     PREDIKAT  : seharusnya SELALU diblokir.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>50 KONTROL: cookie lintas-origin</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
var f;
function go(){f=document.createElement('iframe');f.src='https://example.com/';document.body.appendChild(f);setTimeout(function(){try{o.textContent='BISA BACA -> UXSS: cookie="'+f.contentDocument.cookie+'"';}catch(e){o.textContent='DIBLOKIR (aman): '+e.name;}},2600);}
</script>
