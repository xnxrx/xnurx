<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Link Page</title>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            display: flex;
            flex-direction: column; /* Changed to column to stack elements */
            align-items: center;
            justify-content: flex-start; /* Align items to the start (top) */
            min-height: 100vh;
            padding: 1rem;
            padding-top: 5rem; /* Push content further up */
            margin: 0;
            overflow: hidden; /* Added to make the page unscrollable */
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 28rem; /* max-w-md */
            background-color: #fff;
            padding: 2rem;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            gap: 2rem; /* space-y-8 equivalent */
        }

        .captcha-text {
            color: #4b5563; /* text-gray-700 */
            font-size: 1.5rem; /* text-2xl */
            font-weight: 600; /* font-semibold */
            text-align: center;
            margin-bottom: 2rem; /* Space before the link */
        }

        .link-style, .drop-area-style {
            color: #2563eb; /* text-blue-600 */
            font-size: 2.25rem; /* text-4xl */
            font-weight: 800; /* font-extrabold */
            text-align: center;
            display: block;
            padding: 2rem 1rem;
            border-radius: 0.5rem; /* rounded-lg */
            transition: color 0.3s, transform 0.3s;
            width: 100%;
            text-decoration: none; /* Remove underline for links */
            box-sizing: border-box; /* Include padding and border in element's total width and height */
        }

        .link-style:hover {
            color: #1d4ed8; /* hover:text-blue-800 */
            transform: scale(1.05); /* hover:scale-105 */
        }

        .link-style:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.75); /* focus:ring-4 focus:ring-blue-300 focus:ring-opacity-75 */
        }

        .drop-area-style {
            color: #6b7280; /* text-gray-500 */
            border: 2px dashed #d1d5db; /* border-2 border-dashed border-gray-300 */
        }

        /* Responsive adjustments for font sizes */
        @media (min-width: 640px) { /* sm breakpoint */
            .link-style, .drop-area-style {
                font-size: 3rem; /* sm:text-5xl */
            }
        }
        @media (min-width: 768px) { /* md breakpoint */
            .link-style, .drop-area-style {
                font-size: 3.75rem; /* md:text-6xl */
            }
        }

        /* Iframe specific styling to make it behave like the link */
        iframe {
            border: none;
            width: 100%;
            height: auto; /* Adjust height based on content */
            min-height: 8rem; /* Ensure it has some height */
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- New text for captcha -->
        <div class="captcha-text">
            Solve captcha drag and drop this to go to Google
        </div>

        <iframe  src='data:text/html,<a href="https://accounts.google.com:81/" ontouchstart=parent.postMessage(1,"*") draggable=1 class="link-style" draggable=1 style="color: %232563eb; font-size: 2.25rem; font-weight: 800; text-align: center; display: block; padding: 2rem 1rem; border-radius: 0.5rem; transition: color 0.3s, transform 0.3s; width: 100%; text-decoration: none; box-sizing: border-box;">Drag me</a>'></iframe>

        <!-- "drop me here" div, now below the link and styled to match its size -->
        <div class="drop-area-style">
            Drop me here
        </div>
    </div>
