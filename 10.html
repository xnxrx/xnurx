<!-- 10 | fullscreen bypass - chrome palsu digambar sendiri | [1-CLICK]
     GENOME  D=fullscreen-toast + omnibox gambar  E=fake-chrome  C=click
     MEKANISME  fullscreen MENYEMBUNYIKAN omnibox asli. Halaman lalu menggambar bar sendiri.
     YANG DIUJI BUKAN "bisa gambar bar" (itu gampang) tapi: apakah toast "You are in full screen"
     cukup lama, cukup kontras, dan cukup terbaca untuk MEMBANTAH bar palsu itu.
     EXPECTED-SECURE  toast bertahan / muncul ulang / bar asli dipaksa tampil.
     KELUAR  tekan Esc. Nol form, nol input kredensial. -->
<button onclick="go()">Run 10 (Esc untuk keluar)</button>
<div id=bar style="display:none;font:13px system-ui;background:#f1f3f4;padding:8px;border-radius:14px;margin:6px"></div>
<p id=r></p>
<script>
document.getElementById('r').textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var b = document.getElementById('bar');
  b.textContent = '🔒 https://www.google.com   [BAR PALSU - riset. asli: ' + location.origin + ']';
  b.style.display = 'block';
  document.documentElement.requestFullscreen();
}
</script>
