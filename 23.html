<!doctype html><meta charset=utf-8>
<!-- PREDIKAT (VULN): credentialless terbaca ("Example Domain") sementara iframe biasa SecurityError
     ORACLE: butuh http(s). Klik probe setelah kedua frame selesai memuat
     EXPECTED-SECURE: KEDUA lengan SecurityError -->
<iframe id=a credentialless src="https://example.com/" width=200 height=90></iframe>
<iframe id=b src="https://example.com/" width=200 height=90></iframe>
<button onclick="probe()">probe</button>
<pre id=p></pre>
<script>
function rd(f){ try { return 'TERBACA: ' + f.contentDocument.title; } catch (e) { return 'SecurityError (' + e.name + ')'; } }
function probe(){ p.textContent = 'REAL: ' + location.href
  + '\ncredentialless : ' + rd(a) + '\niframe biasa   : ' + rd(b) + '   <- KONTROL, harus SecurityError'; }
p.textContent = 'REAL: ' + location.href + '\nsupport credentialless: ' + ('credentialless' in HTMLIFrameElement.prototype);
</script>
