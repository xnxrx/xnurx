<!-- 23 - fullscreen: ada toast atau tidak   [address-bar spoofing | macOS: Safari macOS (tanpa notice tekstual) / Dia (fix >=1.6)]
     MEKANISME : chrome asli disembunyikan atas izin; yang diuji adalah apakah pemberitahuan muncul dan berapa lama terbaca.
     PREDIKAT  : tidak ada notice / notice terlalu singkat untuk membantah UI yang digambar halaman.
     AMAN      : notice muncul, terbaca, dan Esc selalu tersedia.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>23 fullscreen: ada toast atau tidak</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();o.textContent='Esc utk keluar. Hitung berapa detik toast terbaca.';}
</script>
