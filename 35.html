<!-- 35 | ⭐ macOS/Safari · dialog Safari MENGUNCI seluruh jendela — bukan cuma tab | [1-CLICK]
     Perbedaan perilaku yang nyata antara Safari dan Chrome, dan jarang dipakai orang.
     Di Chrome, dialog JS bersifat per-tab: tab lain tetap hidup. Di Safari, dialog dari
     sebuah halaman menghalangi interaksi dengan JENDELA-nya secara lebih luas.
     Artinya: selama dialog terbuka, pengguna tidak bisa mengklik address bar, tidak bisa
     membuka menu, tidak bisa memeriksa apa pun. Satu-satunya jalan adalah menutup dialog.
     Gabungkan dengan file 13 (bar berganti selama dialog) dan hasilnya: keadaan bar-vs-layar
     yang salah, DAN pengguna tidak punya alat untuk memeriksanya selama keadaan itu berlangsung.
     Ini bukan menambah "cara membohongi bar" — ini MENGURANGI alat pembantahnya.
     DIBATASI: 3 dialog, lalu berhenti. Tekan Cancel/OK untuk keluar kapan saja.
     EXPECTED-SECURE  address bar tetap bisa diklik & diperiksa selama dialog terbuka. -->
<button onclick="go()">Run 35 (3 dialog berurutan)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href +
  '\n\nSaat tiap dialog terbuka, COBA: klik address bar, buka menu, ganti tab.' +
  '\nMana yang masih bisa? Catat.';
function go() {
  var n = 0;
  (function next() {
    if (n >= 3) { g.textContent += '\n\nselesai.'; return; }
    n++;
    setTimeout(function () {
      confirm('DIALOG ' + n + ' dari 3\n\nSelagi kotak ini terbuka:\n' +
        '  - bisakah kamu mengklik address bar?\n' +
        '  - bisakah kamu membuka menu?\n' +
        '  - bisakah kamu berpindah tab?\n\n' +
        'Origin asli halaman ini: ' + location.origin);
      next();
    }, 400);
  })();
}
</script>
