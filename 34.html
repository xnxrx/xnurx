<!-- 34 | ambang panjang — di karakter keberapa bar menyerah menampilkan apa pun | [1-CLICK]
     Bukan tebakan, sapuan. URL diperpanjang bertahap lewat pushState (nol request) dan
     kamu mencatat pada panjang berapa perilaku bar berubah.
     Tiga ambang berbeda yang harus dicatat terpisah, karena tiga-tiganya bug yang berbeda:
       A. panjang saat bar mulai MEMOTONG                  (normal, catat saja)
       B. panjang saat eTLD+1 tidak lagi terbaca           <== ini temuan
       C. panjang saat bar berhenti menampilkan apa pun    <== ini temuan yang kamu cari
     Sapuan: 100, 500, 2rb, 8rb, 32rb, 128rb, 512rb karakter. Berhenti sendiri di 512rb.
     BOUNDED: nol request, satu tab, pushState murni. Tekan STOP kapan saja.
     EXPECTED-SECURE  eTLD+1 tetap terbaca di panjang berapa pun; B dan C tidak pernah tercapai. -->
<button onclick="go()">Run 34 (sapuan panjang)</button>
<button onclick="stop=1">STOP</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var L = [100, 500, 2000, 8000, 32000, 128000, 512000], i = 0, stop = 0;
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() { i = 0; stop = 0; step(); }
function step() {
  if (stop || i >= L.length) { g.textContent += '\n\nselesai.'; return; }
  var n = L[i++];
  try { history.pushState({}, '', '/' + 'a'.repeat(n)); } catch (e) { g.textContent += '\nDITOLAK di ' + n + ': ' + e.name; return; }
  g.textContent = 'REAL ORIGIN (host): ' + location.host +
    '\npanjang path saat ini: ' + n + ' karakter' +
    '\npanjang href         : ' + location.href.length +
    '\n\nCATAT SEKARANG:' +
    '\n  A. bar mulai memotong?          ___' +
    '\n  B. host "' + location.host + '" masih terbaca? ___' +
    '\n  C. bar menampilkan apa pun?     ___' +
    '\n\nlanjut otomatis dalam 3 detik...';
  setTimeout(step, 3000);
}
</script>
