<!-- 34 - sandbox allow-scripts + allow-same-origin   [UXSS / SOP bypass | macOS: Dia/Arc/Chrome macOS]
     MEKANISME : kombinasi dua token sandbox yang saling meniadakan; yang diuji apakah frame tetap dianggap same-origin setelah memuat origin lain.
     PREDIKAT  : frame ber-sandbox tetap bisa dibaca induk.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>34 sandbox allow-scripts + allow-same-origin</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function rd(w){try{var t=w.document.title;return 'BISA BACA -> UXSS: title="'+t+'"';}catch(e){return 'DIBLOKIR (aman): '+e.name;}}
var f;
function go(){f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-same-origin');f.src='https://example.com/';document.body.appendChild(f);setTimeout(function(){o.textContent=rd(f.contentWindow);},2600);}
</script>
