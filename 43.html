<!-- 43 | weird-lab W4 x W6 · handle DANGLING disentuh dari dalam handler load (jalur WebKit) | [1-CLICK]
     ASUMSI YANG DILANGGAR  "handle ke dokumen lama tidak dipakai lagi setelah src ditukar"
     Simpan contentWindow sebuah frame, lalu tukar src-nya. Handle lama kini menunjuk dokumen
     DANGLING. Lalu, DARI DALAM handler load dokumen BARU, sentuh handle LAMA.
     Dokumen baru sedang lahir sementara kita memaksa browser melayani dokumen yang seharusnya
     sudah dikubur — dua dokumen hidup di satu slot, di milidetik yang sama.
     Ini kombinasi yang melahirkan kelas FuzzOrigin: origin ditulis ulang saat ada dua kandidat.
     Diarahkan ke WebKit karena manajemen dokumen Safari berbeda struktur dari Blink.
     YANG DIBACA  origin handle lama vs origin frame sekarang. Beda = dua bagian tak sepakat.
     BOUNDED: 6 pertukaran lalu berhenti.
     EXPECTED-SECURE  handle lama netral/BLOCKED, tak pernah mengembalikan origin dokumen baru. -->
<button onclick="go()">Run 43</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var f = document.createElement('iframe'); f.style.cssText = 'width:1px;height:1px;border:0';
  document.body.appendChild(f);
  var dangling = f.contentWindow, n = 0, out = [];
  f.onload = function () {
    n++;
    var a, b;
    try { a = dangling.location.href; } catch (e) { a = 'BLOCKED'; }
    try { b = f.contentWindow.location.href; } catch (e) { b = 'BLOCKED'; }
    out.push('load#' + n + '  lama=' + String(a).slice(-28) + '  kini=' + String(b).slice(-28) +
      (a !== b && a !== 'BLOCKED' ? '  <== TIDAK SEPAKAT' : ''));
    g.textContent = 'REAL ORIGIN: ' + location.origin + '\n\n' + out.join('\n');
    if (n < 6) f.src = n % 2 ? '30.html' : 'about:blank';
  };
  f.src = '30.html';
}
</script>
