<!-- 18 | ⭐⭐ macOS/Safari · bar HANYA menampilkan DOMAIN — panen konsekuensinya | [NO-CLICK]
     FAKTA PENENTU  Safari default TIDAK menampilkan skema, path, query, maupun fragment.
     Yang terlihat cuma label domain. (Settings > Advanced > "Show full website address" = mati.)
     Konsekuensinya berlawanan arah, dan keduanya penting:
       MATI      seluruh keluarga "path menyamar jadi host" tak terlihat -> jangan buang waktu
       HIDUP     apa pun yang menyentuh LABEL DOMAIN jadi jauh lebih kuat, karena tidak ada
                 skema/path/query yang tersisa untuk membantahnya. Permukaannya menyusut jadi
                 satu string pendek - dan string pendek jauh lebih mudah dipenuhi atau dikosongkan.
     File ini melaporkan APA yang sebenarnya terlihat, supaya kamu berhenti menebak.
     EXPECTED-SECURE  eTLD+1 selalu terbaca utuh, apa pun panjang & isi subdomainnya. -->
<pre id=g style="font:12px/1.7 monospace"></pre>
<h2 style="font:19px system-ui">Lihat address bar. Berapa banyak yang benar-benar tertulis?</h2>
<script>
var ua = navigator.userAgent;
var safari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR/.test(ua);
var arc = /Arc\//.test(ua);
g.textContent =
  'REAL ORIGIN   : ' + location.href +
  '\nhost          : ' + location.host +
  '\npath+query    : ' + (location.pathname + location.search + location.hash) +
  '\nmesin         : ' + (safari ? 'Safari/WebKit' : arc ? 'Arc' : /Chrome/.test(ua) ? 'Chromium-based' : 'lain') +
  '\nplatform      : ' + navigator.platform +
  '\n\nCATAT DENGAN MATA, tiga hal:' +
  '\n  1. address bar menulis "' + location.host + '" saja, atau URL penuh?' +
  '\n  2. skema (https / gembok) terlihat?' +
  '\n  3. path "' + location.pathname + '" terlihat?' +
  '\n\nKalau jawabannya domain-saja: permukaan yang harus diserang tinggal SATU string pendek.' +
  '\nItu menyempitkan seluruh riset ini ke file 19-23.';
</script>
