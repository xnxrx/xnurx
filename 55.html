<!-- 55 - Navigation API intercept ke tujuan lintas-origin   [UXSS popup | U1=popup U2=commit + Navigation API | T3 | macOS: Dia/Arc/Safari/Chrome]
     GERBANG YANG DISERANG : pembatasan Navigation API: canIntercept WAJIB false untuk tujuan lintas-origin
     DI MANA PALING MUNGKIN TEMBUS : fork yang tertinggal patch (Dia/Arc/Brave/Vivaldi/Opera/Samsung),
                 WebView & in-app browser, build lama, atau konteks ber-sandbox/ekstensi. Di Chrome/Safari
                 terbaru yang sehat, jawaban BLOCKED adalah jawaban yang BENAR - catat versinya, jangan dipaksa.
     MEKANISME : di dalam popup MILIK KITA dipasang listener navigate; lalu popup itu dinavigasikan ke situs korban. Untuk tujuan lintas-origin canIntercept WAJIB false - kalau engine keliru memberi true, URL berpindah ke korban sementara dokumen kita tetap hidup.
     PREDIKAT  : canIntercept bernilai true untuk tujuan lintas-origin (URL korban + dokumen kita).
     AMAN      : akses lintas-origin ditolak SecurityError; baris bukti berkata BLOCKED.
     ANTI-FP   : vonis HANYA dari pembacaan isi korban (judul/origin yang dilaporkan sendiri).
                 "berhasil menulis" ke dokumen kosong awal BUKAN bukti - itu memang dokumen kita.
                 Kontrol batch = 64.html; kalau 64 ikut CROSSED, semua hasil batch ini batal.
     ETIKA     : browser & mesin sendiri. Korban = example.com (IANA reserved). Nol form, nol kredensial,
                 nol fetch/beacon, nol resource luar. Berhenti di predikat -> screenshot -> lapor VRP. -->
<meta charset="utf-8"><title>55 Navigation API intercept ke tujuan lintas-origin</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var V='https://example.com/';var o;function say(s){o=o||document.getElementById('o');o.textContent=s;}
function rd(w){try{var t=w.document.title;return 'CROSSED -> baca judul lintas-origin: "'+t+'"';}catch(e){return 'BLOCKED (aman): '+e.name;}}
addEventListener('load',function(){say('REAL: '+location.origin+' | siap');});
function go(){window.open(location.pathname+'?child=1','x','width=520,height=620');
say('popup anak dibuka; hasil dilaporkan balik ke sini');}
if(location.search.indexOf('child=1')>=0){addEventListener('load',function(){
var r='navigation API tidak ada di engine ini';
try{navigation.addEventListener('navigate',function(e){r='canIntercept='+e.canIntercept+' -> '+(e.canIntercept?'BAHAYA: lintas-origin bisa di-intercept':'aman');
try{if(e.canIntercept)e.intercept({handler:function(){return new Promise(function(){});}});}catch(x){}});}catch(x){}
setTimeout(function(){try{opener.document.getElementById('o').textContent=r;}catch(x){}document.title=r;},1200);
setTimeout(function(){location=V;},1500);});}
</script>
