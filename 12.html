<!-- 12 - window.stop() di anak (render-hang)   [address-bar spoofing | macOS: Dia/Arc/Chrome/Safari macOS]
     MEKANISME : HOLD tanpa jaringan: anak dinavigasi ke URL tepercaya lalu di-stop() sebelum commit, dokumen lama tetap hidup.
     PREDIKAT  : bilah anak menulis https://www.google.com sementara isinya ditulis pembuka.
     AMAN      : stop() tidak menahan tampilan bilah.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>12 window.stop() di anak (render-hang)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://www.google.com/','x');setTimeout(function(){try{w.stop();w.document.write('<h3>BUKAN google.com - '+location.origin+'</h3>');}catch(e){o.textContent='stop/write ditolak: '+e.name;}},60);}
</script>
