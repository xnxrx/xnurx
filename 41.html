<!-- 41 | W9 x W2  MODE SALAH x SAAT SEKARAT - beraksi saat tab DIBEKUKAN print-preview | [1-CLICK]
     ASUMSI YANG DILANGGAR  "halaman tidak melakukan apa-apa selama dialog cetak terbuka"
     IDE GILA  window.print() menahan eksekusi halaman di banyak engine - tab membeku sampai
     dialog ditutup. Yang membeku itu HALAMAN. Yang TIDAK ikut membeku: timer yang sudah
     terlanjur dijadwalkan, jendela lain, dan pembukuan UI browser.
     Jadi kita jadwalkan pengecatan bar palsu + navigasi HOLD, lalu langsung membekukan diri.
     Saat pengguna menutup dialog, halaman melanjutkan dari state yang tidak konsisten.
     Ini "saat sekarat" versi yang dikendalikan pengguna - jendela waktunya selebar
     berapa lama dialog cetak dibiarkan terbuka, artinya BISA DILEBARKAN SESUKA HATI.
     EXPECTED-SECURE  membekukan diri tidak mengubah apa pun yang UI browser tampilkan.
     KELUAR  tutup dialog cetak (Esc / Cancel). Tidak ada yang benar-benar dicetak. -->
<button onclick="go()">Run 41 (dialog cetak terbuka — tekan Cancel)</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var w = window.open('', '', 'width=820,height=520');
  w.document.write('<h2 style="font:19px system-ui">jendela ini disiapkan sebelum induknya beku</h2>');
  setTimeout(function () { try { w.location = 'https://www.google.com:82'; } catch (e) { } }, 50);
  var t0 = Date.now();
  print();
  g.textContent = 'REAL ORIGIN: ' + location.origin +
    '\nhalaman beku selama : ' + (Date.now() - t0) + ' ms' +
    '\n\nSemakin lama dialog dibiarkan terbuka, semakin lebar jendelanya.' +
    '\nBaca omnibox jendela anak SEKARANG, lalu bandingkan dgn 23.html.';
}
</script>
