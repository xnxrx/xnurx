<!-- SF-DIA-02 | GENOME A=- B=window.open(features custom-size) C=click D=S5 permission-prompt E=- F=document.write G=desktop-popup-custom-size X=dia-macos
     GROUNDING: CVE-2025-15032 (Dia <1.9.0, High 7.4, frozzipies + novemberelang) = "jendela custom-size yang
                URL bar-nya TIDAK menampilkan about:blank". Fix-nya menyentuh permukaan BAR. Aturan emas patch-bypass:
                fix per-PERMUKAAN, cacat per-INVARIAN -> tebakan pertama = permukaan TETANGGA yang tak ikut di-pin.
                Di sini tetangganya = PROMPT IZIN yang dimunculkan dari jendela itu.
     PREDIKAT : prompt izin muncul untuk jendela custom-size yang isinya ditulis penyerang, sementara jendela itu
                sendiri tidak memperlihatkan origin yang bisa membantahnya (atau menyebut origin yang salah).
     ORACLE   : Run 02 -> baca (a) apa yang tertulis di bar jendela kecil, (b) origin yang disebut prompt izin.
                Cocokkan dengan panel di jendela induk. Screenshot keduanya dalam satu frame.
     EXPECTED-SECURE: jendela menampilkan about:blank (perilaku pasca-1.9.0) DAN prompt menyebut origin induk
                yang sebenarnya. Dua-duanya benar = arm INERT, catat versinya.
     KONTROL  : tombol CONTROL = jendela DEFAULT (tanpa features). Kalau default juga tak menyebut origin,
                temuannya bukan soal custom-size -> naikkan ke kelas "popup tanpa indikator origin".
     ETIKA    : koordinat tak dibaca; tanpa form/kredensial/fetch/exfil.
     STATUS   : HIPOTESIS - belum diuji di Dia. -->
<meta charset="utf-8"><title>02 custom-size window permission origin</title>
<h3>02 &mdash; prompt izin di jendela custom-size (tetangga CVE-2025-15032)</h3>
<button onclick="run()">Run 02</button> <button onclick="ctl()">CONTROL (jendela default)</button>
<pre id="p"></pre>
<script>
var F = 'width=480,height=620,left=200,top=120';
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href;
function open_(f){
  var w = window.open('', '', f);
  w.document.write('<h3>Jendela ini ditulis oleh ' + location.origin + ' &mdash; BUKAN www.google.com</h3>');
  w.navigator.geolocation.getCurrentPosition(function(){}, function(){});
}
function run(){ open_(F); }
function ctl(){ open_(''); }
</script>
