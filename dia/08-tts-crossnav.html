<meta charset="utf-8"><title>08 TTS outlives navigation</title>
<h3>08 &mdash; audio yang hidup lebih lama dari origin pembuatnya</h3>
<button onclick="run(1)">Run 08</button> <button onclick="run(0)">CONTROL (tanpa pindah halaman)</button>
<pre id="p"></pre>
<script>
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nRekam layar: bar vs suara yang masih berjalan.';
function run(nav){
  var u = new SpeechSynthesisUtterance(
    'satu, dua, tiga, empat, lima, enam, tujuh, delapan, sembilan, sepuluh, ' +
    'sebelas, dua belas, tiga belas, empat belas, lima belas, enam belas, tujuh belas, delapan belas');
  u.rate = 0.85;
  speechSynthesis.speak(u);
  if (nav) setTimeout(function(){ location.href = 'https://www.google.com/'; }, 600);
}
</script>
