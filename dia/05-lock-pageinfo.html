<meta charset="utf-8"><title>05 lock chip + page-info claim</title>
<h3>05 &mdash; gembok &amp; bubble info-situs saat navigasi menggantung</h3>
<button onclick="run()">Run 05</button>
<pre id="p"></pre>
<script>
var T = 'https://www.google.com:9090/';
document.getElementById('p').textContent =
  'REAL origin : ' + location.origin + '\nREAL href   : ' + location.href +
  '\nLangkah: klik ikon gembok / info-situs di jendela kecil, lalu baca host + status di bubble.';
function run(){
  var w = window.open('', '', 'width=520,height=640,left=200,top=120');
  w.document.write('<h3>Klik gembok di jendela ini. Dokumen ini milik ' + location.origin + '</h3>');
  setInterval(function(){ w.location.replace(T); }, 9800);
}
</script>
