<!-- 42 | weird-lab W5 · tujuan navigasi yang BERUBAH selagi dibaca (jalur WebKit) | [1-CLICK]
     ASUMSI YANG DILANGGAR  "membaca sebuah URL tidak punya efek samping"
     location dan window.open menerima string. Beri objek, dan browser harus memanggil
     toString/Symbol.toPrimitive dulu. Kita taruh efek samping DI DALAM konversi itu:
     saat browser sedang menghitung "URL mana yang dituju", kita sudah memindahkannya.
     Keputusan tujuan dan tindakan menuju terjadi pada state yang berbeda — TOCTOU di lapisan
     konversi tipe, bukan di lapisan jaringan. Lapisan ini hampir tidak pernah diuji.
     Dua bentuk konversi diuji terpisah karena jalur kodenya berbeda: toString biasa,
     dan Symbol.toPrimitive yang lebih jarang di-handle.
     YANG DIBACA  berapa kali konversi dipanggil, dan URL akhir yang tercetak di bar.
     >1 panggilan = URL dibaca ulang setelah state berubah = jendela nyata.
     EXPECTED-SECURE  konversi tepat sekali, di awal, dan navigasi kedua membatalkan yang pertama utuh. -->
<button onclick="go('toString')">toString</button>
<button onclick="go('primitive')">Symbol.toPrimitive</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go(mode) {
  var n = 0, w = window.open('', '', 'width=760,height=440');
  if (!w) { g.textContent = 'popup diblokir.'; return; }
  w.document.write('<div style="font:15px system-ui;padding:14px">tujuan dihitung sambil berpindah<br><small>' + location.origin + '</small></div>');
  var hit = function () { n++; if (n === 1) { try { w.location = 'about:blank'; } catch (e) { } } return 'https://www.google.com/'; };
  var obj = mode === 'toString' ? { toString: hit } : (function () { var o = {}; o[Symbol.toPrimitive] = hit; return o; })();
  try { w.location = obj; } catch (e) { }
  setTimeout(function () {
    var v; try { v = w.location.href; } catch (e) { v = 'BLOCKED'; }
    g.textContent = 'REAL ORIGIN: ' + location.origin + '\nmode: ' + mode +
      '\nkonversi dipanggil: ' + n + ' kali' + '\nw.location.href   : ' + v +
      '\n\n>1 = URL dibaca ulang setelah state berubah. Baca juga bar popup-nya.';
  }, 1400);
}
</script>
