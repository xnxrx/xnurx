<!-- 40 - handle opener setelah anak pindah origin   [UXSS / SOP bypass | macOS: Dia/Arc/Safari macOS]
     MEKANISME : handle jendela tetap dipegang setelah anak berpindah ke origin korban; yang diuji apa saja yang masih terbaca lewat handle itu.
     PREDIKAT  : properti navigasi/dokumen anak masih terbaca.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>40 handle opener setelah anak pindah origin</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://example.com/','x');setTimeout(function(){try{o.textContent='BISA BACA -> UXSS: href='+w.location.href;}catch(e){o.textContent='DIBLOKIR (aman): '+e.name;}},2600);}
</script>
