<!-- 49 | UXSS + W7 x W5  SIMULTANITAS x TIPE SALAH - dua origin diperebutkan sekaligus | [1-CLICK]
     ASUMSI YANG DILANGGAR  "satu frame menuju satu origin pada satu waktu"
     IDE GILA  tembakkan DUA navigasi ke DUA origin berbeda pada frame yang sama, di task yang sama,
     dengan tujuan kedua berupa OBJEK yang baru menghitung URL-nya saat dibaca (W5).
     Jadi saat browser sedang menentukan origin mana yang menang, kandidatnya berubah.
     Strategi ini dipinjam dari FuzzOrigin: semakin sering operasi origin-update dipaksa terjadi,
     semakin besar peluang menyentuh jalur yang cacat. Bedanya, di sini keduanya dipaksa
     BERSAMAAN, bukan berantai.
     PENGAMAT  sampler dua-pandangan berjalan tiap 60ms mencari kombinasi MUSTAHIL
     (title terbaca padahal href ditolak, atau sebaliknya) - artinya dua bagian browser tak sepakat.
     EXPECTED-SECURE  mustahil = 0 selamanya.  BOUNDED: 12 putaran lalu berhenti sendiri. -->
<button onclick="go()">Run 49</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
var B = 'https://example.com/';        // ganti ke origin KEDUA milikmu
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var f = document.createElement('iframe'); f.style.cssText = 'width:1px;height:1px;border:0';
  document.body.appendChild(f);
  var round = 0, bad = 0, reads = 0;
  var shifty = { toString: function () { reads++; return reads % 2 ? B : '30.html'; } };
  var a = setInterval(function () {
    round++;
    try { f.contentWindow.location.href = '30.html'; f.contentWindow.location.href = shifty; } catch (e) { }
    if (round >= 12) clearInterval(a);
  }, 400);
  var b = setInterval(function () {
    var t, l;
    try { t = !!f.contentWindow.document.title || true; } catch (e) { t = false; }
    try { l = !!f.contentWindow.location.href; } catch (e) { l = false; }
    if (t !== l) bad++;
    g.textContent = 'REAL ORIGIN: ' + location.origin + '\nputaran: ' + round + '/12   toString dibaca: ' + reads +
      '\nkombinasi MUSTAHIL: ' + bad + '\n\n' + (bad ? 'CROSSED -> screenshot, STOP, lapor VRP' : 'dua pandangan sinkron');
    if (round >= 12) clearInterval(b);
  }, 60);
}
</script>
