<h3>Pindah ke tab lain, lalu kembali ke sini.</h3>
<p id=r></p>
<script>
document.getElementById('r').textContent = 'REAL ORIGIN: ' + location.href;
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  document.write('<h2>SPOOFED saat tab kembali &mdash; bukan google.com</h2>');
  location = 'https://www.google.com:82';
  setInterval(function () { location = 'https://www.google.com:82'; }, 9800);
});
</script>
