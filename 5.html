
<!DOCTYPE html>
<html>
<title>URL Fusion Anomaly Lab</title>
<body>

<button onclick="run()">RUN FUSION</button>
<pre id="out"></pre>

<script>
function run() {

  const payloads = [
    "https://user%40example.test@example.org:443/a/../b?next=@google.com#@facebook.com",

    "https://example.test\\@example.org/%252f%252e%252e/?x=%2540google.com",

    "https://example.test//@example.org/%3Fnext%3Dhttps%253A%252F%252Fexample.org",

    "https://example.test:443@example.org/%E3%80%80/%2e%2e/?a=#fragment@google.com",

    "https://example.test/%2525252f%25252540example.org?u=//example.org#\\@test",

    "https://example.test./a//b/../c?next=https://example.org#%2540google.com"
  ];

  let report = [];

  for (const value of payloads) {
    try {
      const u = new URL(value);

      report.push(
        "INPUT: " + value +
        "\nHOST: " + u.host +
        "\nORIGIN: " + u.origin +
        "\nPATH: " + u.pathname +
        "\nQUERY: " + u.search +
        "\nHASH: " + u.hash +
        "\n-------------------------"
      );
    } catch (e) {
      report.push("INVALID: " + value + "\n" + e.message);
    }
  }

  history.replaceState(
    {fusion: true, timestamp: Date.now()},
    "",
    location.pathname + "?fusion=" + Date.now() + "#lab"
  );

  document.getElementById("out").textContent =
    report.join("\n\n");
}
</script>

</body>
</html>
