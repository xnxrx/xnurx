     Prerender melukis dokumen tujuan DI LATAR sebelum pengguna pergi ke sana. Saat aktivasi,
     browser harus menukar DUA hal sekaligus: dokumen yang tampil DAN URL di bar.
     Kalau keduanya ditukar di jalur kode yang berbeda, ada kemungkinan urutannya tidak atomik.
     DUA ARAH, dua-duanya bernilai:
       bar duluan  -> bar menulis tujuan, layar masih halaman ini   (spoofing klasik)
       konten duluan -> layar sudah tujuan, bar masih halaman ini   (lebih jarang, sama buruknya)
     File ini juga jadi KONTROL untuk 1-3: halaman ter-prerender melukis instan, jadi
     jendela commit-vs-paint HARUS ~0 ms. Kalau di sini pun ada jendela, sebabnya bukan paint.
     EXPECTED-SECURE  aktivasi atomik, selisih 0 ms, di kedua arah. -->
