
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebView Address Bar Research Lab</title>

<style>
body {
  background:#101522;
  color:#e8edf7;
  font:14px Arial;
  padding:20px;
}
main {max-width:900px;margin:auto}
section {
  background:#1a2435;
  border:1px solid #35445c;
  border-radius:10px;
  padding:16px;
  margin:14px 0;
}
button,input {
  padding:10px;
  margin:4px;
  border-radius:6px;
}
button {
  background:#294c78;
  color:white;
  border:0;
  cursor:pointer;
}
input {
  background:#0b1220;
  color:white;
  border:1px solid #46546b;
}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  max-height:400px;
  overflow:auto;
  color:#9dc7ff;
}
</style>
</head>

<body>
<main>

<h2>WebView Address Bar Desynchronization Lab</h2>
<p>Navigation and document-state research harness.</p>

<section>
<h3>Configuration</h3>

<label>Authorized test URL</label><br>
<input id="target" value="https://example.com/" size="45">

<br>
<label>Delay (ms)</label><br>
<input id="delay" type="number" value="1000">

<br>
<button onclick="validateTarget()">Validate target</button>
</section>

<section>
<h3>Navigation experiments</h3>

<button onclick="runTest('baseline')">Baseline</button>
<button onclick="runTest('delayed')">Delayed navigation</button>
<button onclick="runTest('history')">History API</button>
<button onclick="runTest('unicode')">Unicode URL</button>
<button onclick="runTest('encoding')">Encoding</button>
<button onclick="runTest('sequence')">Navigation sequence</button>
<button onclick="runTest('popup')">Window lifecycle</button>

</section>

<section>
<h3>Document state</h3>
<pre id="state">Waiting...</pre>
</section>

<section>
<h3>Event timeline</h3>
<button onclick="exportLog()">Export JSON</button>
<button onclick="clearLog()">Clear</button>
<pre id="log"></pre>
</section>

</main>

<script>
"use strict";

const events = [];

function record(name, extra={}) {
  const entry = {
    event:name,
    timestamp:performance.now(),
    href:location.href,
    origin:location.origin,
    hostname:location.hostname,
    readyState:document.readyState,
    visibility:document.visibilityState,
    ...extra
  };

  events.push(entry);
  render();
}

function render() {
  document.getElementById("state").textContent =
    JSON.stringify({
      href:location.href,
      origin:location.origin,
      hostname:location.hostname,
      pathname:location.pathname,
      readyState:document.readyState
    },null,2);

  document.getElementById("log").textContent =
    events.map(x =>
      "["+x.timestamp.toFixed(2)+"ms] "+
      x.event+" | "+x.href
    ).join("\n");
}

function getTarget() {
  const u = new URL(
    document.getElementById("target").value
  );

  if (!["https:","http:"].includes(u.protocol))
    throw Error("Unsupported protocol");

  if (!["example.com","example.org","example.net"].includes(u.hostname))
    throw Error("Use an authorized test domain");

  return u;
}

function validateTarget() {
  try {
    const u = getTarget();
    record("target-validated",{
      target:u.href
    });
    alert("Valid test target");
  } catch(e) {
    alert(e.message);
  }
}

function runTest(type) {
  let u;

  try {
    u = getTarget();
  } catch(e) {
    alert(e.message);
    return;
  }

  record("test-start:"+type);

  switch(type) {

    case "baseline":
      record("baseline-document-state");
      break;

    case "delayed":
      setTimeout(() => {
        record("delayed-navigation-observation");
      },Number(document.getElementById("delay").value));
      break;

    case "history":
      history.pushState(
        {research:true},
        "",
        location.pathname+"?research="+Date.now()
      );
      record("history-pushstate");
      history.replaceState(
        {research:true,updated:true},
        "",
        location.pathname+"#observation"
      );
      record("history-replacestate");
      break;

    case "unicode":
      record("unicode-encoding-observation",{
        encoded:"%E2%80%8B%E3%80%80",
        decoded:decodeURIComponent("%E2%80%8B%E3%80%80")
      });
      break;

    case "encoding":
      record("encoding-observation",{
        single:encodeURIComponent("/"),
        double:encodeURIComponent(encodeURIComponent("/")),
        parsed:new URL(u.href).href
      });
      break;

    case "sequence":
      record("sequence-step-1");
      setTimeout(() => record("sequence-step-2"),100);
      setTimeout(() => record("sequence-step-3"),300);
      setTimeout(() => record("sequence-step-4"),600);
      break;

    case "popup":
      // Open a blank test window directly from user interaction.
      const child = window.open("about:blank","_blank");
      record("popup-created",{
        popupAvailable:!!child
      });

      if(child) {
        child.document.body.textContent =
          "WebView test window";
      }
      break;
  }
}

["DOMContentLoaded","load","pageshow",
 "pagehide","popstate","hashchange"].forEach(name => {
  window.addEventListener(name,() => record(name));
});

window.addEventListener("error",e => {
  record("javascript-error",{
    message:e.message
  });
});

document.addEventListener("visibilitychange",() => {
  record("visibilitychange");
});

function exportLog() {
  const blob = new Blob(
    [JSON.stringify(events,null,2)],
    {type:"application/json"}
  );

  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);

  a.href=url;
  a.download="webview-research.json";
  a.click();

  URL.revokeObjectURL(url);
}

function clearLog() {
  events.length=0;
  render();
}

record("initial-document");
</script>
</body>
</html>
