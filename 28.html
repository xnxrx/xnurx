<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>html,body{margin:0}
#fake{position:fixed;top:0;left:0;right:0;height:52px;background:#f1f3f4;display:flex;align-items:center;padding:0 12px;font:14px system-ui;z-index:9}
#pill{background:#fff;border-radius:20px;padding:8px 14px;flex:1}
#body{padding:64px 14px 0;font:15px system-ui} #jail{height:200vh}</style>
<div id=fake><span id=pill>&#128274; www.google.com</span></div>
<div id=body><b>Gulir sedikit ke bawah — toolbar Chrome asli menyembunyikan diri, bar di atas tinggal satu-satunya.</b>
<pre id=p></pre><button onclick="scrollTo(0,0)">reset</button></div>
<div id=jail></div>
<script>
addEventListener('scroll', () => { if (scrollY > 60) scrollTo(0, 60); }, { passive: true });
p.textContent = 'REAL: ' + location.href;
</script>
