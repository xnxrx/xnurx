<!-- 37 | macOS · permukaan di mana atribusi tinggal FAVICON + JUDUL, tanpa URL | [NO-CLICK]
     Ada beberapa tempat di macOS di mana pengguna memilih halaman TANPA melihat URL sama sekali:
       tab overview Safari (Cmd+Shift+\)   · Tab Groups   · pinned tab (favicon saja)
       Mission Control / Stage Manager     · pengalih aplikasi Cmd+Tab (untuk app Dock)
     Di semua itu yang menyebut halaman hanyalah FAVICON dan JUDUL — dan keduanya
     sepenuhnya dikendalikan halaman, tanpa filter apa pun.
     Jadi ini bukan spoof address bar; ini spoof di permukaan yang MENGGANTIKAN address bar
     saat pengguna sedang memilih. Sering luput karena semua orang menatap omnibox.
     File ini mengganti judul & favicon berkala ke bentuk yang menyamar jadi atribusi sistem,
     supaya kamu bisa melihat langsung seberapa jauh permukaan itu bisa dibentuk.
     EXPECTED-SECURE  permukaan pemilih tetap menyebut origin, atau judul/favicon disaring. -->
<pre id=g style="font:12px/1.7 monospace"></pre>
<h2 style="font:19px system-ui">Buka tab overview (Cmd+Shift+\), lalu Mission Control. Apa yang menyebut halaman ini?</h2>
<link id=ic rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Ctext y='12' x='2' font-size='11'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<script>
var T = ['https://www.google.com', 'google.com — Sign in', '🔒 google.com', 'Safari', location.host], i = 0;
setInterval(function () {
  document.title = T[i % T.length]; i++;
  g.textContent = 'REAL ORIGIN : ' + location.href +
    '\njudul saat ini: ' + JSON.stringify(document.title) +
    '\nfavicon      : gembok (data: URI, digambar halaman)' +
    '\n\nDi tab overview / Tab Group / pinned tab / Mission Control:' +
    '\n  apakah ada SATU pun tempat yang menyebut ' + location.host + '?' +
    '\n  kalau tidak ada, pengguna memilih halaman berdasarkan teks yang KITA tulis.';
}, 2500);
</script>
