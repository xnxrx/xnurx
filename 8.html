<!doctype html><meta charset=utf-8>
<!-- PREDIKAT: label host in-app menampilkan google.com sementara dokumen tetap milikku
     ORACLE: buka dari DM/postingan AKUN SENDIRI (IG/Threads/FB/LINE/X) -> screenshot label + panel
     EXPECTED-SECURE: label kembali ke host nyata begitu navigasi dibatalkan -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const T = 'https://www.google.com/', ABORT = 'sf35-noapp://x';
function go(){ location.href = T; setTimeout(() => { location.href = ABORT; }, 120); }
p.textContent = 'REAL: ' + location.href;
</script>
