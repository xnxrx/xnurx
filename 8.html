
<!DOCTYPE html>
<html>
<body>
<script>
const w = open("https://www.threads.com", "LIFECYCLE_LAB");

window.addEventListener("visibilitychange", () => {
  console.log("Parent visibility:", document.visibilityState);
});

window.addEventListener("pagehide", () => {
  console.log("Parent page hidden");
});

if (w) {
  setTimeout(() => {
    if (!w.closed) {
      w.document.title = "Lifecycle Test";
      w.document.body.innerHTML =
        "<h1>Lifecycle State</h1>";
    }
  }, 2000);
}
</script>
</body>
</html>
