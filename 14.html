<!doctype html><meta charset=utf-8>
<!-- PREDIKAT: bar tetap melukis google.com padahal navigasinya sudah dibuang
     ORACLE: klik go -> screenshot bar + panel. Ulangi dengan D = 0 / 50 / 200 / 600 ms, catat mana yang menahan
     CONTROL: hapus baris setTimeout(...)  |  EXPECTED-SECURE: bar kembali ke URL nyata -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const T = 'https://www.google.com/', D = 50;
function go(){
  location.href = T;
  setTimeout(() => { location.hash = 'x' + Math.round(performance.now());
    p.textContent = 'REAL: ' + location.href + '\nclobbered after ' + D + 'ms'; }, D);
}
p.textContent = 'REAL: ' + location.href;
</script>
