<!-- 32 | macOS/Safari · skema yang browser lain sudah tutup — WebKit punya aturan sendiri | [1-CLICK]
     Chrome menutup navigasi top-level ke data: (2018) dan sangat membatasi javascript:.
     WebKit menempuh jalur berbeda dan tidak selalu di titik yang sama. Karena aturannya
     tidak pernah diselaraskan, ada kemungkinan bentuk yang mati di Chrome masih hidup di Safari —
     dan dokumen dari skema seperti ini tidak punya host untuk ditampilkan bar.
     Enam bentuk diuji, dari yang paling mungkin ditolak sampai yang paling mungkin lolos.
     Yang dicari BUKAN "berhasil membuka" tapi: bar menulis APA untuk dokumen yang tak punya host?
     Kosong? Nama skema? URL penuh yang sangat panjang? Sisa halaman sebelumnya?
     Kalau salah satunya kosong sementara kontennya terlukis, itu tepat sasaran.
     EXPECTED-SECURE  navigasi top-level ke skema tanpa-host ditolak, atau bar menulisnya utuh. -->
<button onclick="go()">Run 32 (6 tab)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var html = '<h2 style="font:20px system-ui">konten terlukis — bar menulis apa?</h2>';
  var U = [
    ['data: html', 'data:text/html,' + encodeURIComponent(html)],
    ['data: base64', 'data:text/html;base64,' + btoa(html)],
    ['data: charset aneh', 'data:text/html;charset=utf-7,' + encodeURIComponent(html)],
    ['blob:', URL.createObjectURL(new Blob([html], { type: 'text/html' }))],
    ['javascript:', 'javascript:document.write(' + JSON.stringify(html) + ')'],
    ['about:blank', 'about:blank']
  ];
  U.forEach(function (u, i) {
    setTimeout(function () {
      var w = window.open(u[1], '_blank');
      if (!w) return;
      if (u[0] === 'about:blank') setTimeout(function () { try { w.document.write(html); } catch (e) { } }, 200);
    }, i * 600);
  });
  g.textContent = 'REAL ORIGIN: ' + location.origin + '\n6 tab dibuka:\n' +
    U.map(function (u, i) { return '  ' + (i + 1) + '. ' + u[0]; }).join('\n') +
    '\n\nUntuk tiap tab: konten terlukis? bar menulis apa?' +
    '\nKonten terlukis + bar kosong = tepat sasaran.';
}
</script>
