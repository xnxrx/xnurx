
<!DOCTYPE html>
<html>
<body>
<script>
(async function() {

  const w = window.open("https://www.threads.com", "ASYNC_LAB");

  await new Promise(r => setTimeout(r, 1800));

  if (w && !w.closed) {
    w.document.body.innerHTML =
      "<h1>Async Window Experiment</h1>";
  }

  await new Promise(r => setTimeout(r, 1200));

  if (w && !w.closed) {
    w.document.title = "Completed";
  }

})();
</script>
</body>
</html>
