
<!DOCTYPE html>
<html>
<body>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));

(async () => {
  const w = open("https://www.threads.com", "PROMISE_LAB");

  await wait(800);
  if (!w || w.closed) return;

  w.document.body.innerHTML = "<h1>https://www.threads.com</h1>";

  await wait(1200);
  w.document.title = "PROMISE PHASE 2";

  await wait(1600);
  w.document.body.innerHTML += "<h2>https://www.threads.com</h2>";
})();
</script>
</body>
</html>
