<!doctype html><meta charset=utf-8>
<button onclick="go()">buka PiP</button>
<pre id=p></pre>
<script>
async function go(){
  if (!self.documentPictureInPicture) return p.textContent += '\nPiP API tidak ada di browser ini.';
  const w = await documentPictureInPicture.requestWindow({ width: 520, height: 300 });
  w.document.body.style.margin = 0;
  w.document.body.innerHTML =
    '<div style="height:34px;background:#dee1e6;font:13px system-ui;display:flex;align-items:center;padding:0 10px">'
    + '<span style="background:#fff;border-radius:16px;padding:4px 12px;flex:1">&#128274; https://www.google.com/</span></div>'
    + '<div style="padding:14px;font:14px system-ui"><b>Jendela ini tidak punya address bar.</b>'
    + '<pre>REAL opener: ' + location.href + '</pre></div>';
  p.textContent += '\nPiP terbuka: always-on-top, nol atribusi origin';
}
p.textContent = 'REAL: ' + location.href;
</script>
