<!-- 39 | W8  TUKAR IDENTITAS DI TENGAH (TOCTOU tingkat-API) | [1-CLICK]
     ASUMSI YANG DILANGGAR  "objek yang browser PERIKSA adalah objek yang kemudian ia PAKAI"
     IDE GILA  jendela bernama bisa direbut: window.open('', 'nama') mengembalikan jendela LAMA
     kalau namanya cocok. Jadi kita ganti name sebuah jendela SETELAH browser memeriksanya tapi
     SEBELUM ia memakainya. Pemeriksaan keamanan mengukur satu jendela, tindakan mengenai jendela lain.
     Ini kelas yang sama dengan TOCTOU di filesystem, dipindah ke tabel nama jendela browser -
     tempat yang hampir tidak pernah di-review karena dianggap fitur kuno.
     YANG DIBACA  apakah handle hasil open bernama-sama mengembalikan dokumen dgn origin berbeda.
     EXPECTED-SECURE  penamaan tidak pernah menyeberangkan origin; handle selalu cocok dgn yang diperiksa. -->
<button onclick="go()">Run 39</button>
<pre id=g style="font:12px/1.6 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var out = ['REAL ORIGIN: ' + location.origin, ''];
  var a = window.open('', 'slot', 'width=520,height=340');
  a.document.write('<h3 style="font:16px system-ui">jendela A</h3>');
  var before; try { before = a.location.origin; } catch (e) { before = 'BLOCKED'; }
  a.name = 'slot2';                                   // identitas ditukar SETELAH diperiksa
  var b = window.open('', 'slot', 'width=520,height=340,left=560');
  b.document.write('<h3 style="font:16px system-ui">jendela B (nama yang sama)</h3>');
  var after; try { after = b.location.origin; } catch (e) { after = 'BLOCKED'; }
  out.push('origin sebelum tukar-nama : ' + before);
  out.push('origin sesudah tukar-nama : ' + after);
  out.push('a === b ?                 : ' + (a === b));
  out.push('', a === b ? 'slot dipakai ulang -> periksa apakah DOM A tertimpa B tanpa navigasi'
                       : 'slot terpisah -> catat, lalu ulangi sambil menukar name di timing berbeda (10.html/50.html)');
  g.textContent = out.join('\n');
}
</script>
