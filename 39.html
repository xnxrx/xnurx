<!-- 39 | weird-lab W6 x W7 · fullscreen reentran + serentak, versi WebKit | [1-CLICK]
     Ulangan file 35/36 lama tapi diarahkan ke WebKit, karena implementasi fullscreen Safari
     ditulis terpisah dari Blink dan notice-nya berbeda bentuk & durasi.
     W6 reentransi : requestFullscreen dipanggil DARI DALAM handler fullscreenchange
     W7 simultan   : dua elemen memintanya di task yang sama
     Yang diincar bukan "berhasil fullscreen" — melainkan apakah jumlah NOTICE yang muncul
     bisa lebih sedikit dari jumlah transisi. Notice adalah satu-satunya pembantah untuk
     seluruh keluarga fake-chrome; setiap transisi yang lolos tanpa notice adalah satu
     kesempatan menggambar bar palsu tanpa dibantah.
     BOUNDED: 8 transisi lalu berhenti. Esc kapan saja.
     EXPECTED-SECURE  jumlah notice == jumlah masuk-fullscreen, tanpa kecuali. -->
<button onclick="go()">Run 39 (Esc untuk keluar)</button>
<div id=a style="padding:14px;background:#eef;font:14px system-ui">A</div>
<div id=b style="padding:14px;background:#efe;font:14px system-ui">B</div>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var n = 0, MAX = 8, ok = 0, no = 0;
function draw() {
  g.textContent = 'REAL ORIGIN: ' + location.href +
    '\ntransisi        : ' + n + ' / ' + MAX +
    '\npromise resolve : ' + ok + '   reject: ' + no +
    '\nmasuk-fullscreen: ' + Math.ceil(n / 2) +
    '\n\nHITUNG DGN MATA: notice muncul berapa kali?' +
    '\nKurang dari jumlah masuk-fullscreen = ada transisi tanpa pembantah.';
}
draw();
document.addEventListener('fullscreenchange', function () {
  n++; draw();
  if (n >= MAX) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else document.getElementById(n % 4 < 2 ? 'a' : 'b').requestFullscreen().then(function () { ok++; draw(); }, function () { no++; draw(); });
});
function go() {
  a.requestFullscreen().then(function () { ok++; draw(); }, function () { no++; draw(); });
  b.requestFullscreen().then(function () { ok++; draw(); }, function () { no++; draw(); });
}
</script>
