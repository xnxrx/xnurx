<!-- 39 - window.name bertahan lintas-origin   [UXSS / SOP bypass | macOS: semua macOS]
     MEKANISME : window.name bertahan menyeberangi navigasi lintas-origin; ia jadi kanal yang tak terikat origin.
     PREDIKAT  : nilai yang ditanam origin ini terbaca setelah jendela pindah ke origin lain.
     AMAN      : pembacaan lintas-origin dilempar SecurityError; baris bukti berkata DIBLOKIR.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>39 window.name bertahan lintas-origin</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('','x');w.name='TITIP-'+location.origin;setTimeout(function(){w.location='https://example.com/';},300);setTimeout(function(){try{o.textContent='name bertahan: '+w.name;}catch(e){o.textContent='DIBLOKIR (aman): '+e.name;}},2600);}
</script>
