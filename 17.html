<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SOP Membrane Probe</title>
<style>
 body{font:13px/1.6 ui-monospace,monospace;background:#0d1117;color:#cdd9e5;padding:20px}
 h3{margin:0 0 6px} small{color:#8b949e}
 button{background:#238636;color:#fff;border:0;padding:7px 14px;border-radius:6px;cursor:pointer}
 table{border-collapse:collapse;margin-top:14px;max-width:980px;width:100%}
 th,td{border:1px solid #30363d;padding:5px 9px;text-align:left}th{background:#161b22}
 .vuln{color:#ff7b72;font-weight:700}.sec{color:#3fb950}.bad{color:#d29922;font-weight:700}
 #sink{position:absolute;left:-9999px;width:1px;height:1px}
</style>
</head>
<body>
<h3>SOP Membrane Probe <small>— satu canary, delapan cara menyeberangi batas origin</small></h3>
<div>Canary tujuan: <code id="cn"></code> &nbsp;<button id="go">RUN (N=20 / arm)</button> <span id="st"></span></div>
<div id="out"></div><div id="sink"></div>
<script>
const TOK=Math.random().toString(36).slice(2,10);
const SRC='CANARY-SRC-'+TOK;              // dokumen LAMA  -> sah dibaca, bukan bug
const DST='CANARY-DST-'+TOK;              // dokumen TUJUAN-> terbaca = SOP jebol
const N=20, html=t=>'<!doctype html><meta charset=utf-8><h1>'+t+'</h1>';
cn.textContent=DST;

function read(win,tok){                    // satu-satunya primitif baca
  try{const d=win.document; if(!d||!d.documentElement)return'NULL';
      return d.documentElement.textContent.includes(tok)?'READ':'EMPTY';}
  catch(e){return'BLOCKED:'+e.name}
}
const mk=c=>new Promise(r=>{const f=document.createElement('iframe');
  if(c.sandbox!==undefined)f.setAttribute('sandbox',c.sandbox);
  if(c.srcdoc)f.srcdoc=c.srcdoc; if(c.src)f.src=c.src;
  f.onload=()=>setTimeout(()=>r(f),0); sink.appendChild(f);
  if(!c.src&&!c.srcdoc)setTimeout(()=>r(f),0);});

const ARMS=[
{n:'1 about:blank + parent.write',w:'kontrol positif: probe harus bisa baca',x:'READ',
 r:async()=>{const f=await mk({src:'about:blank'});f.contentDocument.write(html(DST));
   const v=read(f.contentWindow,DST);f.remove();return v}},
{n:'2 blob: buatan parent',w:'blob mewarisi origin pembuatnya',x:'READ',
 r:async()=>{const u=URL.createObjectURL(new Blob([html(DST)],{type:'text/html'}));
   const f=await mk({src:u});const v=read(f.contentWindow,DST);URL.revokeObjectURL(u);f.remove();return v}},
{n:'3 srcdoc tanpa sandbox',w:'srcdoc mewarisi origin induk',x:'READ',
 r:async()=>{const f=await mk({srcdoc:html(DST)});const v=read(f.contentWindow,DST);f.remove();return v}},
{n:'4 srcdoc + sandbox=""',w:'sandbox tanpa allow-same-origin = origin OPAK',x:'BLOCKED',
 r:async()=>{const f=await mk({srcdoc:html(DST),sandbox:''});const v=read(f.contentWindow,DST);f.remove();return v}},
{n:'5 data:text/html',w:'data: URL selalu origin opak',x:'BLOCKED',
 r:async()=>{const f=await mk({src:'data:text/html,'+encodeURIComponent(html(DST))});
   const v=read(f.contentWindow,DST);f.remove();return v}},
{n:'6 javascript: di frame sandbox',w:'skema js: tak boleh menghidupkan origin induk di frame opak',x:'BLOCKED',
 r:async()=>{const f=await mk({sandbox:'allow-scripts',src:'javascript:'+JSON.stringify(html(DST))});
   const v=read(f.contentWindow,DST);f.remove();return v}},
{n:'7 cucu: sandbox -> about:blank anak',w:'rantai pewarisan origin lewat dua lapis',x:'BLOCKED',
 r:async()=>{const kid='<script>const i=document.createElement("iframe");document.body.appendChild(i);'+
   'i.contentDocument.write('+JSON.stringify(html(DST))+')<\/script>';
   const f=await mk({srcdoc:'<body>'+kid,sandbox:'allow-scripts'});
   let v;try{v=read(f.contentWindow.frames[0],DST)}catch(e){v='BLOCKED:'+e.name}
   f.remove();return v}},
{n:'8 overhang commit (same-origin -> opak)',w:'jendela antara navigasi dimulai & origin di-update',x:'BLOCKED',
 r:async()=>{const f=await mk({src:'about:blank'});f.contentDocument.write(html(SRC));
   const t0=performance.now();f.src='data:text/html,'+encodeURIComponent(html(DST));
   let v='BLOCKED:timeout';
   while(performance.now()-t0<200){const q=read(f.contentWindow,DST);
     if(q==='READ'){v='READ@'+(performance.now()-t0).toFixed(1)+'ms';break}
     if(q.startsWith('BLOCKED')){v=q;break}
     await new Promise(s=>setTimeout(s,0));}
   f.remove();return v}},
];

go.onclick=async()=>{go.disabled=true;let invalid=false;
  let t='<table><tr><th>Arm</th><th>Harus</th><th>p (x/'+N+')</th><th>Contoh hasil</th><th>Vonis</th><th>Garansi yang diuji</th></tr>';
  for(const a of ARMS){st.textContent=' menjalankan '+a.n+'...';
    let hit=0,last='';
    for(let i=0;i<N;i++){last=await a.r();if(last.startsWith('READ'))hit++;}
    let v,c; if(a.x==='BLOCKED'){v=hit?'UXSS-VULN':'SECURE';c=hit?'vuln':'sec';}
    else{v=hit===N?'OK':'HARNESS-INVALID';c=hit===N?'sec':'bad';if(hit!==N)invalid=true;}
    t+=`<tr><td>${a.n}</td><td>${a.x}</td><td>${hit}/${N}</td><td>${last}</td><td class=${c}>${v}</td><td>${a.w}</td></tr>`;}
  out.innerHTML=t+'</table>'+(invalid
    ?'<p class=bad>Lengan kontrol gagal -> hasil arm lain TIDAK sah. Jalankan lewat http(s)://, bukan file://.</p>'
    :'<p class=sec>Kontrol lolos: arm 4-8 sah dinilai. Aman = semua arm 4-8 SECURE (0/'+N+').</p>');
  st.textContent='';go.disabled=false;};
</script>
</body></html>
