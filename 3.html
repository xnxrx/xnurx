<!-- 03 - hold TEST-NET (jalan offline)   [address-bar spoofing | macOS: semua macOS]
     MEKANISME : penggantung = 192.0.2.1 (TEST-NET-1, dijamin timeout) sehingga tak butuh jaringan target sama sekali.
     PREDIKAT  : bilah menahan URL yang tak pernah tersambung.
     AMAN      : bilah menampilkan error/origin asli.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>03 hold TEST-NET (jalan offline)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
var T='https://192.0.2.1/';o.textContent='REAL: '+location.origin;
function go(){document.write('<h2>hold TEST-NET - '+location.origin+'</h2>');location=T;setInterval(function(){location=T;},9800);}
</script>
