
<!DOCTYPE html>
<html>
<body>
<script>
(function() {

  window.open("https://example.com", "_blank");

  let count = 0;

  const turbo = setInterval(function() {
    alert("TURBO ALERT #" + (++count));

    if (count >= 10) {
      clearInterval(turbo);
    }
  }, 2000);

})();
</script>
</body>
</html>
