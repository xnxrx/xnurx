<!doctype html><meta charset=utf-8>
<!-- BATAS: 1200ms, SEKALI per klik, bukan loop berkelanjutan (dos.md: ukur, jangan meledakkan)
     PREDIKAT: bar melukis google.com sementara layar masih dokumen lama; ukur berapa lama bertahan
     ORACLE: rekam layar, hitung ms sejak klik sampai bar/piksel berubah
     CONTROL: ganti 1200 -> 0  |  EXPECTED-SECURE: selisih 0 ms -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
const T = 'https://www.google.com/', MS = 1200;
function go(){
  location.href = T;
  const end = performance.now() + MS; while (performance.now() < end);   // sekali, berbatas
  p.textContent += '\nbusy ' + MS + 'ms selesai';
}
p.textContent = 'REAL: ' + location.href;
</script>
