<!doctype html><meta charset=utf-8>
<!-- Same-origin, jadi nilainya di PATH: sasaran = label yang menampilkan URL penuh + meng-elide host (in-app/mobile)
     PREDIKAT: bar menampilkan /accounts.google.com/signin/... sementara dokumen tak pernah berganti
     CONTROL: handler -> ()=>Promise.resolve()
     EXPECTED-SECURE: URL tak berpindah sebelum handler selesai, atau ada indikator loading yang jujur -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
if (!self.navigation) p.textContent = 'Navigation API tidak ada di engine ini = INERT (itu jawaban, catat).';
else navigation.addEventListener('navigate', e => { if (e.canIntercept) e.intercept({ handler: () => new Promise(() => {}) }); });
function go(){ navigation.navigate('/accounts.google.com/signin/identifier'); setTimeout(paint, 300); }
function paint(){ p.textContent = 'REAL: ' + location.href + '\ndokumen: TIDAK berganti'; }
paint();
</script>
