<!-- 15 - userinfo (user@host)   [address-bar spoofing | macOS: Safari/Arc/Dia macOS]
     MEKANISME : bagian userinfo dibuat menyerupai host tepercaya; yang menentukan origin adalah bagian SETELAH @.
     PREDIKAT  : bilah menonjolkan "www.google.com" padahal authority-nya host lain.
     AMAN      : browser membuang/meredupkan userinfo dan menonjolkan authority.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>15 userinfo (user@host)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){window.open('https://www.google.com@'+location.host+'/','_blank');}
</script>
