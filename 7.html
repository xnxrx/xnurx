<!doctype html><meta charset=utf-8>
<!-- PREDIKAT: selagi dialog terbuka, bar SUDAH google.com; tekan "Stay" -> apakah tetap?
     ORACLE: screenshot (a) saat dialog terbuka (b) 3 detik setelah Stay
     EXPECTED-SECURE: bar = URL nyata di KEDUA momen -->
<button onclick="go()">go</button>
<pre id=p></pre>
<script>
addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
function go(){ location.href = 'https://www.google.com/'; }
p.textContent = 'REAL: ' + location.href;
</script>
