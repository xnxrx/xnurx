
<!DOCTYPE html>
<html>
<body>
<script>
const w = open("https://www.threads.com");

if (w) {
  const observer = new MutationObserver(() => {
    console.log("DOM changed");
  });

  const timer = setInterval(() => {
    if (!w || w.closed) {
      clearInterval(timer);
      observer.disconnect();
      return;
    }

    try {
      if (w.document.body) {
        observer.observe(w.document.body, {
          childList: true,
          subtree: true
        });

        w.document.body.innerHTML =
          "<h1>https://www.threads.com</h1>";

        clearInterval(timer);
      }
    } catch(e) {
      console.log("https://www.threads.com");
    }
  }, 1000);
}
</script>
</body>
</html>
