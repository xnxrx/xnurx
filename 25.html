<!-- 25 | macOS · jendela popup — Safari vs Arc vs Chrome memberi chrome yang BERBEDA | [1-CLICK]
     Aturan "fitur mana yang dihormati window.open" berbeda per mesin, dan tidak pernah
     diselaraskan. Safari, Arc, Brave, Chrome masing-masing memutuskan sendiri berapa banyak
     chrome yang tersisa dan seberapa kecil jendela boleh dibuat.
     Perbedaan aturan itu SENDIRI adalah permukaan: kalau satu mesin menyisakan jendela tanpa
     teks origin di ukuran yang mesin lain menolaknya, itu selisih yang bisa dilaporkan.
     Enam kombinasi fitur x satu pengukuran geometri, dibuka berurutan lalu ditutup sendiri.
     Anak jendela mencetak origin ASLI-nya di badan, jadi satu screenshot memuat
     kebohongan dan kebenarannya sekaligus.
     EXPECTED-SECURE  setiap popup, ukuran & fitur apa pun, tetap menampilkan origin yang tak bisa ditulisi. -->
<button onclick="go()">Run 25 (6 popup berurutan)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var F = ['width=520,height=320',
  'width=520,height=320,location=no,toolbar=no,menubar=no,status=no',
  'width=200,height=140',
  'width=120,height=90',
  'width=520,height=320,left=-400,top=-200',
  'width=520,height=320,popup=yes'];
var out = [];
g.textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  out = ['REAL ORIGIN: ' + location.origin, ''];
  F.forEach(function (f, i) {
    setTimeout(function () {
      var w = window.open('', 'p' + i, f);
      if (!w) { out.push(String(i + 1).padStart(2) + '. DIBLOKIR  ' + f); g.textContent = out.join('\n'); return; }
      w.document.write('<div style="font:12px system-ui;padding:8px"><b>popup ' + (i + 1) + '</b><br>origin asli: ' + location.origin + '</div>');
      setTimeout(function () {
        out.push(String(i + 1).padStart(2) + '. chrome ' + String(w.outerHeight - w.innerHeight).padStart(3) + 'px' +
          '  posisi ' + w.screenX + ',' + w.screenY + '  ukuran ' + w.outerWidth + 'x' + w.outerHeight + '   ' + f);
        g.textContent = out.join('\n') + '\n\nchrome ~0 atau posisi negatif = origin tidak ada di layar.';
        w.close();
      }, 1400);
    }, i * 1900);
  });
}
</script>
