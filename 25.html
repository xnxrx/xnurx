<!doctype html><meta charset=utf-8>
<!-- PREDIKAT (VULN): jendela hasil aktivasi prefetch bisa dibaca dari sini
     ORACLE: butuh http(s). Klik go (aktivasi), tunggu termuat, klik probe
     CONTROL: hapus blok speculationrules lalu ulangi - kalau hasilnya SAMA, prefetch bukan variabelnya
     EXPECTED-SECURE: SecurityError, dengan atau tanpa prefetch -->
<script type="speculationrules">{"prefetch":[{"urls":["https://example.com/"]}]}</script>
<button onclick="go()">go (aktivasi)</button> <button onclick="probe()">probe</button>
<pre id=p></pre>
<script>
let w = null;
function go(){ w = window.open('https://example.com/', 'v'); p.textContent += '\naktivasi dikirim'; }
function probe(){ let r; try { r = 'TERBACA: ' + w.document.title; } catch (e) { r = 'SecurityError (' + e.name + ')'; }
  p.textContent = 'REAL: ' + location.href + '\nbaca w.document: ' + r; }
p.textContent = 'REAL: ' + location.href + '\nspeculationrules didukung: ' + HTMLScriptElement.supports('speculationrules');
</script>
