<!-- 25 - retensi setelah javascript: URI   [address-bar spoofing | macOS: Arc/Dia macOS]
     MEKANISME : popup dinavigasi ke javascript: URI yang tidak menghasilkan dokumen baru; yang diuji apa yang tersisa di bilah.
     PREDIKAT  : bilah menahan URL sebelumnya padahal dokumen sudah ditulis ulang.
     AMAN      : bilah menampilkan about:blank / origin pembuka.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>25 retensi setelah javascript: URI</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://www.google.com/','x');setTimeout(function(){try{w.location='javascript:document.write("<h3>ditulis ulang<\/h3>")';}catch(e){o.textContent=e.name;}},80);}
</script>
