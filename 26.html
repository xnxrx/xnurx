<!-- 26 | BAR KOSONG - dorong chrome-nya KELUAR LAYAR | [1-CLICK]
     Sumbu geometri, bukan sumbu parser. Bar tidak dibohongi dan tidak dihilangkan -
     ia digeser ke koordinat yang tidak terlihat mata, sementara area konten tetap di layar.
     Browser modern MENJEPIT koordinat popup supaya ini gagal. Justru itu yang diuji:
     berapa nilai jepitannya, apakah jepitan itu dihitung terhadap layar atau terhadap
     jendela induk, dan apakah setiap FORK memasang jepitan yang sama.
     moveTo/moveBy dipanggil SETELAH jendela lahir - jalur kode berbeda dari fitur di window.open,
     dan jalur kedua ini yang lebih sering lupa dijepit.
     EXPECTED-SECURE  posisi akhir dijepit sehingga chrome selalu ada di dalam layar.
     Angka posisi dicetak supaya laporannya berisi ukuran, bukan kesan. -->
<button onclick="go()">Run 26</button>
<p id=r></p><pre id=g style="font:12px monospace"></pre>
<script>
document.getElementById('r').textContent = 'REAL ORIGIN: ' + location.href;
function go() {
  var w = window.open('', '', 'width=760,height=520,top=-120,left=40');
  w.document.write('<h2 style="font:19px system-ui">Chrome jendela ini ada di atas garis layar?</h2>' +
    '<p style="font:12px monospace">' + location.origin + '</p>');
  var a = w.screenY;
  setTimeout(function () {
    try { w.moveTo(40, -120); } catch (e) { }
    setTimeout(function () {
      g.textContent = 'screenY diminta = -120\nscreenY setelah window.open  = ' + a +
        '\nscreenY setelah moveTo()     = ' + w.screenY +
        '\n\nnilai negatif = jepitan gagal = chrome keluar layar';
    }, 250);
  }, 250);
}
</script>
