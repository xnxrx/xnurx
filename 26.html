<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>#bar{position:fixed;top:0;left:0;right:0;height:38px;background:#dee1e6;font:13px system-ui;display:none;align-items:center;padding:0 10px;z-index:9}
#pill{background:#fff;border-radius:16px;padding:5px 12px;flex:1}</style>
<div id=bar><span id=pill>&#128274; https://www.google.com/</span></div>
<p style="margin-top:60px"><button onclick="go()">go fullscreen</button>
<button onclick="document.exitFullscreen&&document.exitFullscreen()">KELUAR</button></p>
<pre id=p></pre>
<script>
async function go(){
  try { await document.documentElement.requestFullscreen(); } catch(e){ return p.textContent += '\nfullscreen ditolak: ' + e.name; }
  bar.style.display = 'flex';
  try { await navigator.keyboard.lock(['Escape']); p.textContent += '\nkeyboard.lock AKTIF (Esc ditelan)'; }
  catch(e){ p.textContent += '\nkeyboard.lock: ' + e.name + ' (tidak aktif)'; }
}
addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { bar.style.display = 'none'; navigator.keyboard && navigator.keyboard.unlock && navigator.keyboard.unlock(); } });
p.textContent = 'REAL: ' + location.href + '\nUKUR: berapa ms notice "Press Esc" bertahan?';
</script>
