<!-- 19 | ⭐ macOS · label domain DIDORONG KELUAR oleh subdomain panjang | [1-CLICK]
     Konsekuensi langsung dari 18. Kalau yang tampil cuma label domain, maka pertanyaannya:
     bagian MANA dari label itu yang dikorbankan lebih dulu saat ia tak muat?
     Yang benar: eTLD+1 dipertahankan terakhir. Yang sering terjadi: pemotongan dari kanan,
     sehingga yang terbaca justru bagian yang DIKENDALIKAN PENYERANG (subdomain), dan
     eTLD+1 yang sebenarnya terdorong keluar layar.
     Diuji berjenjang: subdomain 20 / 40 / 80 / 160 / 320 karakter, di jendela yang menyempit.
     Yang dicari SATU ANGKA: pada panjang berapa eTLD+1 berhenti terbaca?
     CATATAN  butuh wildcard DNS ke origin-mu supaya subdomain benar-benar resolve. Tanpa itu,
     file ini tetap berguna sebagai pengukur ELISI di jendela sempit (tombol kedua).
     EXPECTED-SECURE  eTLD+1 selalu terbaca, di panjang & lebar berapa pun. -->
<button onclick="win()">Buka 5 jendela dgn lebar menurun</button>
<button onclick="sub()">Uji subdomain panjang (butuh wildcard DNS)</button>
<input id=d value="xnxrx.github.io" style="width:220px;font:13px monospace">
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
g.textContent = 'REAL ORIGIN: ' + location.href;
function win() {
  [560, 420, 320, 240, 180].forEach(function (w, i) {
    setTimeout(function () {
      var p = window.open(location.href, 'w' + w, 'width=' + w + ',height=300,left=' + (30 + i * 40) + ',top=' + (60 + i * 60));
      if (p) p.focus();
    }, i * 400);
  });
  g.textContent = 'REAL ORIGIN: ' + location.origin + '\n5 jendela dibuka (560/420/320/240/180 px).' +
    '\n\nBaca label domain tiap jendela. Pada lebar berapa host berhenti terbaca utuh?';
}
function sub() {
  [20, 40, 80, 160, 320].forEach(function (n, i) {
    setTimeout(function () {
      var host = 'login-aman-verifikasi'.repeat(Math.ceil(n / 21)).slice(0, n) + '.' + d.value.trim();
      window.open('https://' + host + '/', '_blank');
    }, i * 500);
  });
  g.textContent = 'REAL ORIGIN: ' + location.origin +
    '\n5 tab dibuka dgn subdomain 20/40/80/160/320 karakter.' +
    '\n\nTanpa wildcard DNS semuanya akan error — TAPI halaman error pun menampilkan host,' +
    '\njadi tetap terukur: pada panjang berapa eTLD+1 tak lagi terbaca?';
}
</script>
