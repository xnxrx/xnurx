<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;font:15px/1.5 system-ui}
#bar{position:fixed;top:0;left:0;right:0;display:none;align-items:center;background:#dee1e6;padding:0 10px;z-index:9}
#pill{background:#fff;border-radius:20px;padding:6px 14px;flex:1;white-space:nowrap;overflow:hidden}
#main{padding:70px 16px 0}#jail{height:220vh}
</style>
<div id=bar><span id=pill>&#128274; https://www.google.com/</span></div>
<div id=main>
  <button onclick="go()">MULAI</button> <button onclick="out()">KELUAR</button>
  <pre id=p></pre>
</div>
<div id=jail></div>
<script>
const MOBILE = matchMedia('(pointer:coarse)').matches || /Android/.test(navigator.userAgent);
function log(s){ p.textContent = 'REAL: ' + location.href + '\n' + s; }
function jail(){ if (scrollY > 60) scrollTo(0, 60); }
async function go(){
  bar.style.height = MOBILE ? '52px' : '38px'; bar.style.display = 'flex';
  if (MOBILE) { addEventListener('scroll', jail, { passive: true }); scrollTo(0, 62);
    return log('ANDROID: gulir sedikit - toolbar asli menyembunyikan diri, bar di atas tinggal satu-satunya'); }
  try { await document.documentElement.requestFullscreen(); } catch (e) { return log('fullscreen ditolak: ' + e.name); }
  try { await navigator.keyboard.lock(['Escape']); log('DESKTOP: fullscreen + keyboard.lock AKTIF - UKUR ms notice bertahan'); }
  catch (e) { log('DESKTOP: fullscreen aktif, keyboard.lock ' + e.name + ' - UKUR ms notice bertahan'); }
}
function out(){ removeEventListener('scroll', jail); bar.style.display = 'none'; scrollTo(0, 0);
  if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
  if (document.fullscreenElement) document.exitFullscreen(); log('keluar'); }
addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) out(); });
log(MOBILE ? 'mode: Android (scroll-jail)' : 'mode: desktop (fullscreen)');
</script>
