<!-- 29 | BAR KOSONG - bar mobile yang MENGKERUT lalu DIKUNCI | [NO-CLICK, buka di HP]
     Di HP address bar menyusut sendiri saat halaman digulir - itu fitur, bukan bug.
     Yang diuji: setelah mengkerut, bisakah halaman MENAHANNYA supaya tidak mengembang lagi,
     lalu menggambar bar palsu di ruang yang ditinggalkannya?
     Mekanisme penahannya bukan CSS: setiap kali browser mendekati batas atas dokumen -
     satu-satunya kondisi yang memunculkan bar asli kembali - kita dorong balik scroll-nya.
     Itu sebabnya halaman ini sengaja dibuat sangat panjang.
     YANG DIUKUR  berapa lama bar asli bertahan tidak muncul (detik), dan apakah ia
     tetap bisa dipanggil paksa. Angka itu isi laporannya.
     EXPECTED-SECURE  bar selalu bisa dipanggil kembali oleh gestur pengguna, halaman tak bisa mencegah.

<meta name="viewport" content="width=device-width,initial-scale=1">
<div style="position:fixed;top:0;left:0;right:0;font:12px system-ui;background:#f1f3f4;padding:7px;z-index:9">🔒 https://www.google.com <small>[PALSU — riset]</small></div>
<div style="height:6000px;padding-top:44px;font:14px system-ui">Gulir ke bawah. Bar asli akan mengkerut, lalu ditahan.<pre id=g style="font:12px monospace"></pre></div>
<script>
var t0 = Date.now(), maxH = innerHeight;
scrollTo(0, 900);
addEventListener('scroll', function () { if (scrollY < 300) scrollTo(0, 900); }, { passive: true });
setInterval(function () {
  maxH = Math.max(maxH, innerHeight);
  g.textContent = 'REAL ORIGIN : ' + location.href +
    '\ninnerHeight : ' + innerHeight + '  (maks terlihat: ' + maxH + ')' +
    '\ndelta bar   : ' + (maxH - innerHeight) + 'px   (0 = bar asli sedang tersembunyi)' +
    '\ntertahan    : ' + Math.round((Date.now() - t0) / 1000) + ' detik';
}, 500);
</script>
