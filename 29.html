<!-- 29 | macOS/WebKit · bfcache Safari sangat agresif — bar dan dokumen dipulihkan dari SUMBER BERBEDA | [1-CLICK lalu BACK]
     Safari menyimpan halaman utuh di bfcache jauh lebih sering daripada Chrome: DOM, timer,
     variabel, semuanya dibekukan dan dihidupkan lagi apa adanya saat Back.
     Tapi bar TIDAK ikut dibekukan bersama dokumen — ia dihitung ulang dari entri session-history.
     Jadi saat Back, dua hal dipulihkan dari dua tempat yang berbeda, oleh kode yang berbeda.
     Kalau keduanya bisa tidak sepakat walau sesaat, itu jendela yang tidak butuh jaringan sama sekali.
     Diperkuat: sebelum pergi, halaman ini memasang state yang mudah dikenali (judul + DOM),
     jadi saat kembali kamu bisa melihat langsung apakah yang muncul adalah dokumen LAMA
     sementara bar sudah menghitung sesuatu yang lain.
     PROSEDUR  klik Pergi -> tunggu halaman tujuan tampil -> tekan BACK -> baca bar & layar bersamaan.
     EXPECTED-SECURE  saat kembali, bar dan dokumen selalu menunjuk hal yang sama. -->
<h2 id=h style="font:20px system-ui">HALAMAN A — state akan dibekukan</h2>
<button onclick="prep()">1. pasang state</button>
<button onclick="location.href='2.html?block=1200&via=bfcache'">2. Pergi (lalu tekan BACK)</button>
<pre id=g style="font:12px/1.7 monospace"></pre>
<script>
var armed = false, t0 = Date.now();
function draw(x) {
  g.textContent = 'REAL ORIGIN: ' + location.href + '\nstate terpasang: ' + armed +
    '\numur dokumen  : ' + Math.round((Date.now() - t0) / 1000) + ' detik' + (x ? '\n\n' + x : '');
}
draw('');
function prep() { armed = true; h.textContent = 'HALAMAN A — STATE TERPASANG (tandai ini)'; h.style.color = '#b00'; draw(''); }
addEventListener('pageshow', function (e) {
  draw('pageshow persisted(bfcache) = ' + e.persisted +
    '\nstate masih ada = ' + armed +
    '\n\n' + (e.persisted
      ? 'DIPULIHKAN dari bfcache. Umur dokumen di atas TIDAK di-reset = dokumen lama.\nBaca bar SEKARANG: ia menunjuk halaman ini, atau masih 2.html?'
      : 'dimuat ulang biasa — Safari tidak memakai bfcache di sini. Catat sbg ilmu-negatif.'));
});
</script>
